name: Harness complete 2.22 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-22.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.22 and advance 2.23
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.22 Lower basic DAG dependencies, routers, and join descriptors into the IR.",
                      "- [x] 2.22 Lower basic DAG dependencies, routers, and join descriptors into the IR.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.22 DAG/router/join lowering         ▶ CURRENT\n2.23+ compiler tests                  ⏳",
                      "2.22 DAG/router/join lowering         ✅\n2.23 canonical hash tests             ▶ CURRENT\n2.24+ compiler tests                  ⏳",
                  ),
                  (
                      "No fixed digest golden vectors are frozen yet; 2.23 owns stable canonical hash tests. 2.22 remains the Graph-to-IR lowering step.",
                      "No fixed digest golden vectors are frozen yet; 2.23 owns stable canonical hash tests. 2.22 now supplies the deterministic Graph-to-IR lowering step with `lowerCanonicalGraphJsonV1ToExecutionIr`: canonical node/input/entrypoint order defines numeric IR indexes; every data/control edge contributes a scheduler dependency; data edges additionally become `op-output` input sources; dependencies are deduplicated and numerically sorted; authored bindings stay first and incoming data-edge sources follow in canonical edge-id order; indexed control edges preserve structured port names; and router plus all-active join contracts become IR descriptors. Lowering re-resolves exact node/plugin provenance and treats any drift from the canonical pin snapshot as a compiler invariant failure rather than silently compiling against a different registry. Loop, human-interrupt, and subgraph descriptors remain reserved but are not lowered by 2.22. `harness.compiler/v1` remains the compiler behavior identity because 2.22 is its first lowering implementation, not a semantic change after v1 was established.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.22 DAG/router/join lowering                         ▶ CURRENT",
                      "           ├─ 2.22 DAG/router/join lowering                         ✅\n           └─ 2.23 canonical hash tests                              ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.22 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.23 current** |",
                  ),
                  (
                      "Fixed digest golden vectors remain 2.23.",
                      "Fixed digest golden vectors remain 2.23. 2.22 now deterministically lowers canonical Graph semantics into `harness.ir/v1`: canonical array order becomes the op/input/entrypoint index domains; data and control edges both produce predecessor dependencies; data edges also become resolved op-output value sources; duplicate predecessors are removed and sorted numerically; binding sequence is preserved before incoming canonical edge-id order; control edges retain named structured ports; router and all-active join manifests become IR control descriptors; and runtime config/behavior/policies flow into the immutable IR. Resolver provenance must still match the exact 2.17/2.19 node/plugin pins or lowering fails as a compiler invariant. Loop, human-interrupt, and subgraph execution remains deferred. This is the first lowering semantics under `harness.compiler/v1`, so no compiler-version bump is required.",
                  ),
                  (
                      "> **Phase 2 / Item 2.22 — Lower basic DAG dependencies, routers, and join descriptors into the IR.**",
                      "> **Phase 2 / Item 2.23 — Add stable canonical hash tests.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "`ExecutionIrControlDescriptorV1` reserves the already-frozen router, all-active join, loop, human-interrupt, and subgraph control shapes, while indexed `controlEdges` preserve activation/ordering endpoints. This reservation does not implement branch selection, join activation, loop execution, human suspension, or subgraph invocation. In particular it does not weaken 2.10 SCC rejection. 2.22 owns actual lowering of basic DAG dependencies plus router/join descriptors into these shapes.",
                      "`ExecutionIrControlDescriptorV1` reserves the already-frozen router, all-active join, loop, human-interrupt, and subgraph control shapes, while indexed `controlEdges` preserve activation/ordering endpoints. 2.22 now lowers only the initial DAG/router/join slice: router manifests become `{ kind: \"router\", entry, branches }`, all-active join manifests become `{ kind: \"join\", inputs, output, mode: \"all-active\" }`, and ported control edges retain their named indexed endpoints. Loop, human-interrupt, and subgraph descriptors remain reserved by the IR type but are deliberately omitted by the 2.22 lowerer until their later execution phases. This does not weaken 2.10 SCC rejection or add branch-selection/join-runtime behavior; Phase 3 owns scheduling semantics.",
                  ),
                  (
                      "`createExecutionIrV1(candidate)` is an internal invariant boundary, not a new Graph validation pass. It checks that every op/graph-input/control/entrypoint numeric reference is in range, requires dependency lists to be strictly increasing and unique, rejects self-dependencies, then `structuredClone`s and deeply freezes the plan. The caller's candidate is not mutated or frozen. Invalid references at this point indicate a compiler bug because user-facing shape/semantic/policy validation has already succeeded.\n\n2.20 deliberately contains no document hash, semantic hash, registry hash, compiler version, IR hash, or provenance pins; 2.21 owns those identities. It also performs no Graph-to-IR compilation/lowering; 2.22 owns that transformation.",
                      "`createExecutionIrV1(candidate)` is an internal invariant boundary, not a new Graph validation pass. It checks that every op/graph-input/control/entrypoint numeric reference is in range, requires dependency lists to be strictly increasing and unique, rejects self-dependencies, then `structuredClone`s and deeply freezes the plan. The caller's candidate is not mutated or frozen. Invalid references at this point indicate a compiler bug because user-facing shape/semantic/policy validation has already succeeded.\n\n### Graph JSON v1 to Execution IR v1 lowering\n\n2.22 introduces `lowerCanonicalGraphJsonV1ToExecutionIr(canonical, resolver)`. The already-canonical node array defines op indexes, graph inputs define graph-input indexes, and entrypoints define entrypoint indexes. Graph outputs, entrypoints, default entrypoint, graph-input bindings, op-output value sources, and control endpoints are resolved to those numeric domains. Every data or control edge adds its source op to the target's scheduler dependency set; dependencies are deduplicated and sorted numerically before the immutable IR boundary. Data edges additionally become `{ kind: \"op-output\", op, port }` input sources. For each op, authored non-edge bindings preserve their frozen order first, followed by incoming data edges in canonical edge-id order, so v1 multi-source sequence is explicit rather than accidentally commutative.\n\nLowering copies the already-validated runtime material from the exact resolved manifest: executable config, static behavior, retry/recovery/effect information, required capabilities, and the initial router/join control descriptor. Graph hard resource ceilings and capability request/self-deny intent are copied, while external grants/effective authority remain absent. The lowerer re-resolves each `type@version` through `NodeResolutionResolver` and requires the owning plugin id/version to match the canonical node pin. Missing or drifted resolution is a compiler invariant failure, not a new Graph diagnostic, preventing a registry change from silently altering compilation after the 2.21 provenance snapshot.\n\n2.22 is the first deterministic lowering implementation identified by `harness.compiler/v1`; no version bump is needed merely to fill in that initially reserved v1 behavior. Future changes to these frozen lowering semantics must bump compiler identity. Loop, human-interrupt, and subgraph execution remain later work. 2.23 owns fixed canonical hash vectors and stability tests.\n\n2.20 deliberately contains no document hash, semantic hash, registry hash, compiler version, IR hash, or provenance pins; 2.21 owns those identities. 2.22 now owns the basic Graph-to-IR DAG/router/join transformation.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-22.yml
          git commit -m "docs(harness): freeze 2.22 and advance 2.23"
          git push origin HEAD:zet-harness-v1
