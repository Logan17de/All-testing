name: Import verified harness development patch
on:
  push:
    branches: [zet-harness-runtime-dispatch]
    paths: [.github/workflows/harness-import-local.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/zet-harness-runtime-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and apply the tested source batch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat .github/dev/harness-patch/001.xzpart .github/dev/harness-patch/002.xzpart .github/dev/harness-patch/003.xzpart > /tmp/harness.patch.xz
          echo '519a7874585f8e7b6c9da8a87ec4ad8b5b5b17ecac305b8cc2c9900286bea57d  /tmp/harness.patch.xz' | sha256sum --check
          xz --decompress --stdout /tmp/harness.patch.xz > /tmp/harness.patch
          echo 'b142efc93421eb9857763737cfd8307b6301a0d224c194f8c4a92c1ce7b99d2a  /tmp/harness.patch' | sha256sum --check
          git apply --numstat /tmp/harness.patch | awk -F '\t' '$3 !~ /^harness\// { bad=1 } END { exit bad }'
          git apply --check --index /tmp/harness.patch
          git apply --index /tmp/harness.patch
          git rm -- .github/dev/harness-patch/001.xzpart .github/dev/harness-patch/002.xzpart .github/dev/harness-patch/003.xzpart .github/workflows/harness-dev-snapshot.yml .github/workflows/harness-import-local.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(harness): close durable approval dispatch and add model/tool adapter foundations' -m 'Complete 5.17 with the original scheduler, transactional execution, automatic approval wake-up, and process-kill/restart tests. Add 6.1–6.4 public adapter contracts, plugin catalogs and deterministic scripted adapters. Locally verified: 593 tests, backend typecheck/lint, formatting, runtime smoke and baseline. Full Windows/Ubuntu CI remains required before merge. Remove temporary development transport files.'
          test "$(git ls-remote origin refs/heads/zet-harness-runtime-dispatch | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/zet-harness-runtime-dispatch
