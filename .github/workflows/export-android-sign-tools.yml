name: Export Android SDK Lite

on:
  push:
    branches:
      - kanji-recall-apk-build
  workflow_dispatch:

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using build-tools: $BT"
          mkdir -p android-sdk-lite/build-tools android-sdk-lite/platform
          cp -a "$BT/." android-sdk-lite/build-tools/
          cp "$ANDROID_HOME/platforms/android-35/android.jar" android-sdk-lite/platform/android.jar
          echo "$BT" > android-sdk-lite/build-tools-version.txt
          ls -lh android-sdk-lite/build-tools/aapt2 android-sdk-lite/build-tools/zipalign android-sdk-lite/platform/android.jar

      - name: Upload SDK lite
        uses: actions/upload-artifact@v4
        with:
          name: Android-SDK-Lite
          path: android-sdk-lite
          if-no-files-found: error
