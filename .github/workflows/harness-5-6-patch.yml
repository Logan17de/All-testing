name: Harness 5.6 Compile Policy Patch

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-5-6-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - name: Patch remaining 5.6 callers and integration coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          function replace(path, from, to) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(from)) {
              throw new Error(`Expected patch marker not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          const oldContext = `function context(granted: readonly string[] = []): GraphJsonV1DiagnosticContext {
            return {
              resolver,
              capabilityAuthority: { granted },
            };
          }`;
          const newContext = `function context(
            granted: readonly string[] = [],
            denied: readonly string[] = [],
          ): GraphJsonV1DiagnosticContext {
            const grantedSet = new Set(granted);
            const deniedSet = new Set(denied);
            return {
              resolver,
              capabilityAuthority: {
                evaluate(capability) {
                  if (deniedSet.has(capability)) {
                    return { decision: "deny", denialReason: "explicitly-denied" };
                  }
                  return grantedSet.has(capability)
                    ? { decision: "allow" }
                    : { decision: "deny", denialReason: "not-granted" };
                },
              },
            };
          }`;

          replace(
            "harness/packages/graph/src/graph-json-v1-diagnostics.test.ts",
            oldContext,
            newContext,
          );
          replace(
            "harness/packages/graph/src/graph-json-v1-diagnostics.golden.test.ts",
            oldContext,
            newContext,
          );

          replace(
            "harness/packages/graph/src/graph-json-v1-compiler.stress.test.ts",
            `capabilityAuthority: { granted: [] },`,
            `capabilityAuthority: {
              evaluate: () => ({ decision: "deny", denialReason: "not-granted" }),
            },`,
          );

          const baseline = "harness/scripts/lightweight-baseline.bench.ts";
          replace(
            baseline,
            `import { afterAll, beforeAll, bench, describe } from "vitest";`,
            `import { afterAll, beforeAll, bench, describe } from "vitest";\n\nimport { CapabilityPermissionPolicy } from "@zet-harness/core";`,
          );
          replace(
            baseline,
            `capabilityAuthority: { granted: [] },`,
            `capabilityAuthority: new CapabilityPermissionPolicy(),`,
          );

          replace(
            "harness/packages/graph/src/index.ts",
            `// 2.13 intersects graph/node capability demand with external grants and applies graph self-deny; Graph JSON never grants authority.`,
            `// 2.13/5.6 evaluates graph/node capability demand against host authority and applies graph self-deny; Graph JSON never grants authority.`,
          );

          fs.writeFileSync(
            "harness/tests/capability-compile-enforcement.test.ts",
            `import { describe, expect, it } from "vitest";

          import { CapabilityPermissionPolicy } from "@zet-harness/core";
          import {
            GRAPH_JSON_VERSION,
            canonicalizeGraphJsonV1Semantics,
            checkGraphJsonV1CapabilityPolicy,
            checkGraphJsonV1Diagnostics,
            lowerCanonicalGraphJsonV1ToExecutionIr,
            normalizeGraphJsonV1,
            stripGraphJsonV1UiMetadata,
            type GraphJsonV1,
            type NodeResolutionResolver,
          } from "@zet-harness/graph";
          import type { NodeManifest } from "@zet-harness/plugin-api";

          const manifest: NodeManifest = {
            type: "integration.network-read",
            version: "1",
            title: "Integration network read",
            inputs: {},
            outputs: { result: { schema: { type: "string" } } },
            configSchema: { type: "object" },
            behavior: {
              primitiveFamily: "effect",
              determinism: "nondeterministic",
              effect: "external-read",
              idempotency: "idempotent",
              recovery: "rerun",
              executionMode: "in-process",
              requiredCapabilities: ["network:https"],
            },
          };

          const resolver: NodeResolutionResolver = {
            getManifest(type, version) {
              return type === manifest.type && version === manifest.version ? manifest : undefined;
            },
            getResolution(type, version) {
              return type === manifest.type && version === manifest.version
                ? {
                    manifest,
                    plugin: { id: "integration.plugin", version: "1" },
                  }
                : undefined;
            },
          };

          function graph(): GraphJsonV1 {
            return {
              schemaVersion: GRAPH_JSON_VERSION,
              graphId: "phase-5.6.integration",
              revisionId: "rev-1",
              inputs: [],
              outputs: [
                {
                  id: "result",
                  schema: { type: "string" },
                  source: { nodeId: "call", port: "result" },
                },
              ],
              nodes: [
                {
                  id: "call",
                  type: manifest.type,
                  version: manifest.version,
                  config: {},
                },
              ],
              edges: [],
              entrypoints: [{ id: "main", nodeId: "call" }],
              policies: {
                capabilities: {
                  required: ["project:read"],
                  optional: ["telemetry:emit"],
                },
              },
            };
          }

          describe("Phase 5.6 compile-time capability enforcement", () => {
            it("uses the real host permission policy to authorize graph and node demand before lowering", () => {
              const value = graph();
              const policy = new CapabilityPermissionPolicy({
                granted: ["project:read", "network:https", "telemetry:emit", "unrequested"],
              });

              expect(checkGraphJsonV1CapabilityPolicy(value, resolver, policy)).toEqual({
                valid: true,
                requiredCapabilities: ["project:read", "network:https"],
                optionalCapabilities: ["telemetry:emit"],
                effectiveCapabilities: ["project:read", "network:https", "telemetry:emit"],
                diagnostics: [],
              });

              const diagnostics = checkGraphJsonV1Diagnostics(value, {
                resolver,
                capabilityAuthority: policy,
              });
              expect(diagnostics).toEqual({ valid: true, diagnostics: [] });

              const normalized = normalizeGraphJsonV1(value, resolver);
              expect(normalized.valid).toBe(true);
              expect(normalized.normalized).toBeDefined();
              const compilerSource = stripGraphJsonV1UiMetadata(normalized.normalized!);
              const canonical = canonicalizeGraphJsonV1Semantics(compilerSource);
              const ir = lowerCanonicalGraphJsonV1ToExecutionIr(canonical, resolver);
              expect(ir.ops).toHaveLength(1);
              expect(ir.ops[0]?.sourceNodeId).toBe("call");
            });

            it("blocks a host-explicitly-denied manifest requirement at the capability-policy stage", () => {
              const policy = new CapabilityPermissionPolicy({
                granted: ["project:read", "network:https"],
                denied: ["network:https"],
              });

              const result = checkGraphJsonV1Diagnostics(graph(), {
                resolver,
                capabilityAuthority: policy,
              });

              expect(result.valid).toBe(false);
              expect(result.diagnostics).toContainEqual(
                expect.objectContaining({
                  code: "GRAPH_CAPABILITY_REQUIRED_DENIED",
                  stage: "capability-policy",
                  nodeId: "call",
                  path: "/nodes/0",
                }),
              );
            });

            it("blocks a host-explicitly-denied graph requirement without changing the frozen policy path", () => {
              const policy = new CapabilityPermissionPolicy({
                granted: ["project:read", "network:https"],
                denied: ["project:read"],
              });

              const result = checkGraphJsonV1Diagnostics(graph(), {
                resolver,
                capabilityAuthority: policy,
              });

              expect(result.valid).toBe(false);
              expect(result.diagnostics).toContainEqual(
                expect.objectContaining({
                  code: "GRAPH_CAPABILITY_REQUIRED_DENIED",
                  stage: "capability-policy",
                  path: "/policies/capabilities/required",
                }),
              );
            });
          });
          `,
          );
          NODE
      - name: Verify no raw compile grant bags remain
        shell: bash
        run: |
          if grep -R --line-number --fixed-strings 'capabilityAuthority: { granted' harness --include='*.ts'; then
            echo "Raw compile grant bag remains" >&2
            exit 1
          fi
      - name: Format
        working-directory: harness
        run: npx prettier --write packages/graph/src/graph-json-v1-capability-policy.ts packages/graph/src/graph-json-v1-capability-policy.test.ts packages/graph/src/graph-json-v1-diagnostics.test.ts packages/graph/src/graph-json-v1-diagnostics.golden.test.ts packages/graph/src/graph-json-v1-compiler.stress.test.ts packages/graph/src/index.ts scripts/lightweight-baseline.bench.ts tests/capability-compile-enforcement.test.ts
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Lint
        working-directory: harness
        run: npm run lint
      - name: Tests
        working-directory: harness
        run: npm test
      - name: Commit green 5.6 patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/harness-5-6-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness .github/workflows/harness-5-6-patch.yml
          git commit -m "feat(graph): enforce compile-time capability policy"
          git push origin HEAD:zet-harness-v1
