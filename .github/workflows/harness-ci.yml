name: Zet Harness 4.21 File-backed SQLite

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Patch SQLite baseline
        working-directory: harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          benchmark = Path("scripts/lightweight-baseline.bench.ts")
          text = benchmark.read_text()
          old = 'const database = new SqliteDatabase({ path: ":memory:" });'
          new = '''const databaseDirectory = mkdtempSync(join(tmpdir(), "zet-harness-baseline-sqlite-"));
          temporaryDirectories.push(databaseDirectory);
          const database = new SqliteDatabase({ path: join(databaseDirectory, "baseline.sqlite") });'''
          if old not in text:
              raise SystemExit("SQLite baseline database anchor not found")
          benchmark.write_text(text.replace(old, new, 1))

          baseline = Path("BASELINE.md")
          text = baseline.read_text()
          old = "- **SQLite commit latency** — uses `SqliteDatabase.commit()` with its serialized `BEGIN IMMEDIATE` transaction path and one prepared insert."
          new = "- **SQLite commit latency** — uses a temporary file-backed WAL database and `SqliteDatabase.commit()` with its serialized `BEGIN IMMEDIATE` transaction path and one prepared insert."
          if old not in text:
              raise SystemExit("BASELINE SQLite bullet anchor not found")
          baseline.write_text(text.replace(old, new, 1))

          plan = Path("PLAN.md")
          text = plan.read_text()
          old = "while SQLite timing exercises the serialized `SqliteDatabase.commit()` `BEGIN IMMEDIATE` path with a prepared insert."
          new = "while SQLite timing exercises the serialized `SqliteDatabase.commit()` `BEGIN IMMEDIATE` path against a temporary file-backed WAL database with a prepared insert."
          if old not in text:
              raise SystemExit("PLAN SQLite baseline anchor not found")
          plan.write_text(text.replace(old, new, 1))
          PY

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format and verify
        working-directory: harness
        run: |
          npx prettier --write scripts/lightweight-baseline.bench.ts BASELINE.md PLAN.md
          npm run typecheck
          npm run lint
          npm run format:check
          npm run baseline

      - name: Push fix
        working-directory: harness
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add scripts/lightweight-baseline.bench.ts BASELINE.md PLAN.md
          git commit -m "fix(perf): measure file-backed SQLite commits"
          git push origin HEAD:zet-harness-v1
