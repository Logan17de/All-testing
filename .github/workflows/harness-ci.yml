name: Zet Harness 5.1 Windows Timeout Fix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Give seeded file-backed crash loop an explicit timeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("harness/apps/runtime/src/runtime-fault-recovery.test.ts")
          text = path.read_text()
          old = "    }\n  });\n});"
          new = "    }\n  }, 20_000);\n});"
          if not text.endswith(old):
              raise SystemExit("expected final seeded-test closing anchor not found")
          path.write_text(text[:-len(old)] + new)
          PY
          cd harness
          npx prettier --write apps/runtime/src/runtime-fault-recovery.test.ts

      - name: Verify fault suite and static gates
        working-directory: harness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npx vitest run apps/runtime/src/runtime-fault-recovery.test.ts

      - name: Push timeout hardening
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/apps/runtime/src/runtime-fault-recovery.test.ts
          git commit -m "test(runtime): allow seeded crash loop on slow filesystems"
          git push origin HEAD:zet-harness-v1
