name: Zet Harness 4.20 Format

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format and push
        working-directory: harness
        run: |
          npx prettier --write apps/runtime/src/runtime-fault-recovery.test.ts
          npm run format:check
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add apps/runtime/src/runtime-fault-recovery.test.ts
          git commit -m "style(runtime): format crash recovery tests"
          git push origin HEAD:zet-harness-v1
