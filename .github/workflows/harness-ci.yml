name: Zet Harness 4.18 Exact Format

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Exact-format and verify 4.18
        working-directory: harness
        run: |
          npx prettier --write packages/db/src/durable-backup.ts packages/db/src/durable-backup.test.ts
          npm run typecheck --workspace @zet-harness/db
          npm run lint --workspace @zet-harness/db
          npm run test --workspace @zet-harness/db
          npm run format:check

      - name: Commit exact formatting if needed
        run: |
          if git diff --quiet; then
            echo "4.18 files already match exact Prettier output."
            exit 0
          fi
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/packages/db/src/durable-backup.ts harness/packages/db/src/durable-backup.test.ts
          git commit -m "style(db): apply exact 4.18 prettier output"
          git push origin HEAD:zet-harness-v1
