name: Zet Harness 4.19 Health Checks

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Apply 4.19 implementation
        run: |
          printf '%s' '' | base64 -d > harness/apps/runtime/src/runtime-health.ts
          printf '%s' '' | base64 -d > harness/apps/runtime/src/runtime-health.test.ts
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Format and verify 4.19
        working-directory: harness
        run: |
          npx prettier --write apps/runtime/src/runtime-health.ts apps/runtime/src/runtime-health.test.ts apps/runtime/src/runtime-http-server.ts apps/runtime/src/runtime-http-server.test.ts apps/runtime/src/runtime-daemon.ts apps/runtime/src/runtime-daemon.test.ts apps/runtime/src/index.ts
          npm run typecheck --workspace @zet-harness/runtime
          npm run lint --workspace @zet-harness/runtime
          npm run test --workspace @zet-harness/runtime
          npm run format:check

      - name: Commit implementation
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/apps/runtime/src/runtime-health.ts harness/apps/runtime/src/runtime-health.test.ts harness/apps/runtime/src/runtime-http-server.ts harness/apps/runtime/src/runtime-http-server.test.ts harness/apps/runtime/src/runtime-daemon.ts harness/apps/runtime/src/runtime-daemon.test.ts harness/apps/runtime/src/index.ts
          git commit -m "feat(runtime): expand health checks"
          git push origin HEAD:zet-harness-v1
