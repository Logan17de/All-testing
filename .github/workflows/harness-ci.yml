name: Zet Harness 4.21 Closeout

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Advance roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path("harness/TODO.md")
          text = todo.read_text()
          old = "- [ ] 4.21 Add the lightweight baseline: startup latency, idle RSS, direct runtime dependency count, compiler overhead, scheduler overhead, SQLite commit latency."
          new = "- [x] 4.21 Add the lightweight baseline: startup latency, idle RSS, direct runtime dependency count, compiler overhead, scheduler overhead, SQLite commit latency."
          if old not in text:
              raise SystemExit("TODO 4.21 anchor not found")
          todo.write_text(text.replace(old, new, 1))

          plan = Path("harness/PLAN.md")
          text = plan.read_text()
          replacements = {
              "           ├─ 4.21 lightweight performance baseline                            ▶ CURRENT":
                  "           ├─ 4.21 lightweight performance baseline                            ✅",
              "           └─ 4.22 CI baseline check                                            ⏳":
                  "           └─ 4.22 CI baseline check                                            ▶ CURRENT",
              "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.21 current** |":
                  "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.22 current** |",
              "> **Phase 4 / Item 4.21 — Add the lightweight baseline: startup latency, idle RSS, direct runtime dependency count, compiler overhead, scheduler overhead, and SQLite commit latency.**":
                  "> **Phase 4 / Item 4.22 — Record/check the baseline in CI without making noisy machine-specific thresholds brittle.**",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"PLAN anchor not found: {old}")
              text = text.replace(old, new, 1)

          anchor = "Phase 3 deterministic scheduler fixtures live behind the explicit `@zet-harness/scheduler/testing` subpath rather than the production scheduler export."
          paragraph = (
              "Phase 4.21 adds a reproducible lightweight baseline command (`npm run baseline`) without adding production dependencies or hard performance thresholds. "
              "Fresh runtime child processes measure startup through module load, SQLite open/migrations, and HTTP readiness, then report idle RSS; the same command records the direct runtime dependency count from `apps/runtime/package.json`. "
              "A deterministic 64-op chain measures the real Graph JSON validation/normalization/canonicalization/lowering/compiler-identity path and the real `PlainDagRun` scheduler path, while SQLite timing exercises the serialized `SqliteDatabase.commit()` `BEGIN IMMEDIATE` path with a prepared insert. "
              "Timing benchmarks use short warmup/sample windows and runtime startup/RSS report sample count, median, p95, minimum, and maximum. The command has been exercised successfully on hosted Ubuntu and Windows runners, whose materially different startup timings demonstrate why 4.22 must compare recorded baselines without brittle universal machine thresholds.\n\n"
          )
          if paragraph.strip() not in text:
              if anchor not in text:
                  raise SystemExit("PLAN 4.21 paragraph anchor not found")
              text = text.replace(anchor, paragraph + anchor, 1)
          plan.write_text(text)
          PY

          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs: mark Harness 4.21 complete"
          git push origin HEAD:zet-harness-v1
