name: Zet Harness 4.22 Final Format

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format and verify
        working-directory: harness
        env:
          ZET_BASELINE_PLATFORM: ubuntu-latest
        run: |
          npx prettier --write baselines/lightweight-baseline-v1.json scripts/check-lightweight-baseline.test.ts scripts/check-lightweight-baseline.ts scripts/run-lightweight-baseline-ci.ts
          npm run typecheck
          npm run lint
          npm run format:check
          npm run baseline:ci

      - name: Push formatting
        working-directory: harness
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add baselines/lightweight-baseline-v1.json scripts/check-lightweight-baseline.test.ts scripts/check-lightweight-baseline.ts scripts/run-lightweight-baseline-ci.ts
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style(perf): format baseline guard"
            git push origin HEAD:zet-harness-v1
          fi
