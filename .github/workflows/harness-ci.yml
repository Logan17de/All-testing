name: Zet Harness 4.22 Finalize

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Remove obsolete wrapper and format
        working-directory: harness
        shell: bash
        run: |
          rm -f scripts/run-lightweight-baseline-ci.ts
          npx prettier --write package.json baselines/lightweight-baseline-v1.json scripts/lightweight-baseline.bench.ts scripts/check-lightweight-baseline.test.ts scripts/check-lightweight-baseline.ts

      - name: Verify
        working-directory: harness
        env:
          ZET_BASELINE_PLATFORM: ubuntu-latest
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run baseline:ci
          test -f tmp/baseline/runtime.json
          test -f tmp/baseline/bench.json
          test -f tmp/baseline/check.json

      - name: Push correction
        working-directory: harness
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add -A package.json baselines/lightweight-baseline-v1.json scripts
          git commit -m "fix(perf): finalize file-native baseline guard"
          git push origin HEAD:zet-harness-v1
