name: Zet Harness CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zet-harness-v1
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Close 4.6 roadmap
        if: matrix.os == 'ubuntu-latest' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path("TODO.md")
          text = todo.read_text()
          text = text.replace(
              "- [ ] 4.6 Enable foreign keys and WAL mode.",
              "- [x] 4.6 Enable foreign keys and WAL mode.",
              1,
          )
          text = text.replace(
              "**4.6 — Enable foreign keys and WAL mode.**",
              "**4.7 — Define durable graph/source and compiled-plan identity records.**",
              1,
          )
          todo.write_text(text)

          plan = Path("PLAN.md")
          text = plan.read_text()
          text = text.replace(
              "           ├─ 4.5 ordered SQL migration runner                        ✅\n           └─ 4.6 foreign keys + WAL                                  ▶ CURRENT",
              "           ├─ 4.5 ordered SQL migration runner                        ✅\n           ├─ 4.6 foreign keys + WAL                                  ✅\n           └─ 4.7 durable graph/source + compiled-plan identity        ▶ CURRENT",
              1,
          )
          text = text.replace(
              "🚧 In progress — **4.6 current**",
              "🚧 In progress — **4.7 current**",
              1,
          )
          text = text.replace(
              "Foreign-key enforcement remains deliberately disabled so 4.6 stays the single owner of foreign-key/WAL policy.",
              "Phase 4.6 makes the connection policy explicit: every opened database enforces foreign keys, file-backed databases must successfully enter WAL mode before the connection is exposed, and `:memory:` databases retain SQLite's `memory` journal mode because WAL is unavailable there.",
              1,
          )
          text = text.replace(
              "Filesystem migration discovery, schema checksums, foreign-key enablement, WAL mode, and application tables remain out of 4.5; 4.6 specifically owns foreign-key/WAL policy.",
              "Filesystem migration discovery, schema checksums, and application durability tables remain deferred; 4.7 next defines durable graph/source and compiled-plan identity records.",
              1,
          )
          text = text.replace(
              "> **Phase 4 / Item 4.6 — Enable foreign keys and WAL mode.**",
              "> **Phase 4 / Item 4.7 — Define durable graph/source and compiled-plan identity records.**",
              1,
          )
          plan.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: complete sqlite foreign keys and WAL"
          git push origin HEAD:zet-harness-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Plugin smoke
        run: npm run test:plugin-smoke --workspace @zet-harness/core

      - name: Startup smoke
        run: npm run test:startup

      - name: Build
        run: npm run build
