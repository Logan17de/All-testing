name: Zet Harness 4.20 Closeout

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Advance roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path("harness/TODO.md")
          text = todo.read_text()
          old = "- [ ] 4.20 Add random/fault-injection kill/restart tests around node and commit transitions."
          new = "- [x] 4.20 Add random/fault-injection kill/restart tests around node and commit transitions."
          if old not in text:
              raise SystemExit("TODO 4.20 anchor not found")
          todo.write_text(text.replace(old, new, 1))

          plan = Path("harness/PLAN.md")
          text = plan.read_text()
          replacements = {
              "           ├─ 4.20 kill/restart fault-injection tests                          ▶ CURRENT":
                  "           ├─ 4.20 kill/restart fault-injection tests                          ✅",
              "           ├─ 4.21 lightweight performance baseline                            ⏳":
                  "           ├─ 4.21 lightweight performance baseline                            ▶ CURRENT",
              "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.20 current** |":
                  "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.21 current** |",
              "> **Phase 4 / Item 4.20 — Add random/fault-injection kill/restart tests around node and commit transitions.**":
                  "> **Phase 4 / Item 4.21 — Add the lightweight baseline: startup latency, idle RSS, direct runtime dependency count, compiler overhead, scheduler overhead, and SQLite commit latency.**",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"PLAN anchor not found: {old}")
              text = text.replace(old, new, 1)

          anchor = "Phase 3 deterministic scheduler fixtures live behind the explicit `@zet-harness/scheduler/testing` subpath rather than the production scheduler export."
          paragraph = (
              "Phase 4.20 adds deterministic file-backed crash/fault-injection coverage over the durability boundaries already defined by 4.13–4.17. "
              "The suite closes and reopens the real SQLite database at seeded crash cuts before node completion commit, during an injected terminal-event failure inside the atomic completion transaction, after completion commit but before explicit frontier publication, and after recognized frontier events are durable. "
              "It proves that failed completion transactions remain fully rolled back after restart, pre-commit running attempts are surfaced once for recovery-policy classification, committed output references survive restart without being mistaken for scheduler frontier state, and downstream work remains blocked until explicit durable frontier state makes it ready. "
              "Thirty-six deterministic seeds vary those cut points without wall-clock sleeps or probabilistic expectations, so failures remain reproducible across Linux and Windows. "
              "This test item adds no new recovery semantics and does not reinterpret opaque terminal events as scheduler events.\n\n"
          )
          if paragraph.strip() not in text:
              if anchor not in text:
                  raise SystemExit("PLAN 4.20 paragraph anchor not found")
              text = text.replace(anchor, paragraph + anchor, 1)
          plan.write_text(text)
          PY

          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs: mark Harness 4.20 complete"
          git push origin HEAD:zet-harness-v1
