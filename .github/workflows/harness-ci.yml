name: Zet Harness 5.1 Format Fix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format policy files
        working-directory: harness
        run: npx prettier --write packages/plugin-api/src/node-behavior-policy.ts packages/plugin-api/src/node-behavior-policy.test.ts

      - name: Verify focused policy surface
        working-directory: harness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npx vitest run packages/plugin-api/src/node-behavior-policy.test.ts packages/core/src/node-catalog.test.ts packages/graph/src/graph-json-v1-effect-recovery.test.ts

      - name: Push exact formatter output
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/packages/plugin-api/src/node-behavior-policy.ts harness/packages/plugin-api/src/node-behavior-policy.test.ts
          git commit -m "style(policy): format behavior policy"
          git push origin HEAD:zet-harness-v1
