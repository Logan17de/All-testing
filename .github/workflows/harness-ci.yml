name: Zet Harness 4.20 Fault Injection

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"
      - ".github/scripts/apply-harness-420.sh"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-format-probe-413
          fetch-depth: 0

      - name: Preserve patch script
        run: cp .github/scripts/apply-harness-420.sh /tmp/apply-harness-420.sh

      - name: Checkout real Harness branch
        run: |
          git fetch origin zet-harness-v1
          git checkout -B zet-harness-v1 origin/zet-harness-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Apply and verify 4.20
        run: bash /tmp/apply-harness-420.sh
