name: Zet Harness Phase 4 Closeout

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Advance roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          todo = Path("harness/TODO.md")
          replace_once(
              todo,
              "- [ ] 4.22 Record/check the baseline in CI without making noisy machine-specific thresholds brittle.",
              "- [x] 4.22 Record/check the baseline in CI without making noisy machine-specific thresholds brittle.",
          )
          replace_once(
              todo,
              "**4.13 — Keep short SQLite writes serialized through one clear commit path.**",
              "**5.1 — Define and enforce cross-field effect/idempotency/recovery invariants over the Phase 1 node enums.**",
          )

          plan = Path("harness/PLAN.md")
          replace_once(
              plan,
              "Phase 4  Runtime daemon + SQLite           🚧 WE ARE HERE",
              "Phase 4  Runtime daemon + SQLite           ✅ COMPLETE",
          )
          replace_once(
              plan,
              "           └─ 4.22 CI baseline check                                            ▶ CURRENT",
              "           └─ 4.22 CI baseline check                                            ✅",
          )
          replace_once(
              plan,
              "Phase 5  Effects + permissions + humans    ⏳\nPhase 6  Model + tool adapters             ⏳",
              "Phase 5  Effects + permissions + humans    🚧 WE ARE HERE\n           └─ 5.1 effect/idempotency/recovery invariants                       ▶ CURRENT\nPhase 6  Model + tool adapters             ⏳",
          )
          replace_once(
              plan,
              "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.22 current** |",
              "| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | ✅ Complete |",
          )
          replace_once(
              plan,
              "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | ⏳ Planned |",
              "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | 🚧 In progress — **5.1 current** |",
          )
          replace_once(
              plan,
              "npm ci\n→ typecheck\n→ lint\n→ format check\n→ tests\n→ startup smoke\n→ build",
              "npm ci\n→ typecheck\n→ lint\n→ format check\n→ tests\n→ plugin smoke\n→ startup smoke\n→ build\n→ baseline check",
          )
          anchor = "The command has been exercised successfully on hosted Ubuntu and Windows runners, whose materially different startup timings demonstrate why 4.22 must compare recorded baselines without brittle universal machine thresholds."
          phase_422 = (
              anchor
              + "\n\nPhase 4.22 closes the durability phase with a deliberately coarse CI regression guard rather than a portable performance claim. `npm run baseline:ci` runs independently on `ubuntu-latest` and `windows-latest`; the benchmark writes runtime statistics directly to `tmp/baseline/runtime.json`, Vitest 4 writes benchmark medians to `tmp/baseline/bench.json`, and the checker writes `tmp/baseline/check.json` before returning success or failure. Each OS compares only with its own checked-in reference using broad `max(reference × multiplier, reference + additive slack)` ceilings for startup, idle RSS, compiler, scheduler, and file-backed WAL SQLite commit medians, while direct runtime dependency identity is checked exactly. Faster results always pass, cross-OS comparisons are forbidden, and every matrix job uploads the three JSON reports even when the guard fails. This makes large regressions review-visible without letting hosted-runner noise turn CI into a benchmark contest. Phase 4 is complete; Phase 5 now owns effect/idempotency/recovery enforcement and permission boundaries."
          )
          replace_once(plan, anchor, phase_422)
          replace_once(
              plan,
              "> **Phase 4 / Item 4.22 — Record/check the baseline in CI without making noisy machine-specific thresholds brittle.**",
              "> **Phase 5 / Item 5.1 — Define and enforce cross-field effect/idempotency/recovery invariants over the Phase 1 node enums.**",
          )

          baseline = Path("harness/BASELINE.md")
          replace_once(
              baseline,
              "Runtime startup/RSS samples are emitted as one machine-readable line beginning with `ZET_BASELINE_RUNTIME` and include sample count, median, p95, minimum, and maximum. `npm run baseline` also records the benchmark report under the ignored `tmp/baseline/` directory.",
              "Runtime startup/RSS samples are emitted as one machine-readable line beginning with `ZET_BASELINE_RUNTIME` and include sample count, median, p95, minimum, and maximum; the same structured runtime report is written directly to `tmp/baseline/runtime.json`. Vitest writes its benchmark report directly to `tmp/baseline/bench.json` under the same ignored directory.",
          )
          replace_once(
              baseline,
              "CI runs this command independently on `ubuntu-latest` and `windows-latest`. It captures the runtime JSON emitted by the existing baseline command, consumes Vitest 4's benchmark `--outputJson` report, compares the resulting medians with the checked-in per-OS reference in `baselines/lightweight-baseline-v1.json`, and writes `tmp/baseline/check.json` before returning success or failure.",
              "CI runs this command independently on `ubuntu-latest` and `windows-latest`. The baseline command produces `runtime.json` and Vitest 4's `bench.json` directly on disk; the checker consumes both reports, compares their medians with the checked-in per-OS reference in `baselines/lightweight-baseline-v1.json`, and writes `tmp/baseline/check.json` before returning success or failure. No console-output scraping sits in the CI path.",
          )
          PY

          git diff --check
          git diff -- harness/TODO.md harness/PLAN.md harness/BASELINE.md

      - name: Commit closeout
        shell: bash
        run: |
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/TODO.md harness/PLAN.md harness/BASELINE.md
          git commit -m "docs: complete Harness phase 4"
          git push origin HEAD:zet-harness-v1
