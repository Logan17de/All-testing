name: Zet Harness 4.22 Final Matrix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout final implementation head
        uses: actions/checkout@v4
        with:
          ref: a6a8dd4c0e498b51215800f53b3b0d2a047513b3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Plugin smoke
        run: npm run test:plugin-smoke --workspace @zet-harness/core

      - name: Startup smoke
        run: npm run test:startup

      - name: Build
        run: npm run build

      - name: Baseline check
        env:
          ZET_BASELINE_PLATFORM: ${{ matrix.os }}
        run: npm run baseline:ci

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zet-harness-4-22-final-${{ matrix.os }}
          path: harness/tmp/baseline/*.json
          if-no-files-found: error
          retention-days: 14
