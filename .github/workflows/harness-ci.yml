name: Zet Harness CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zet-harness-v1
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close out 4.8 roadmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo = Path("harness/TODO.md")
          text = todo.read_text()
          text = text.replace(
              '- [ ] 4.8 Define runs and nullable `parent_run_id`/fork metadata.',
              '- [x] 4.8 Define runs and nullable `parent_run_id`/fork metadata.',
          )
          text = text.replace(
              '**4.8 — Define runs and nullable `parent_run_id`/fork metadata.**',
              '**4.9 — Define node attempts including iteration, attempt, status, timing, input/output refs, errors, usage, and stable logical effect/idempotency ID.**',
          )
          todo.write_text(text)

          plan = Path("harness/PLAN.md")
          text = plan.read_text()
          text = text.replace(
              '           └─ 4.8 runs + parent/fork metadata                          ▶ CURRENT',
              '           ├─ 4.8 runs + parent/fork metadata                          ✅\n           └─ 4.9 node attempts + effect/idempotency identity             ▶ CURRENT',
          )
          text = text.replace(
              '| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.8 current** |',
              '| **4 — Runtime daemon + SQLite durability** | long-lived Node runtime, HTTP/SSE, `node:sqlite`, WAL, events, checkpoints, blobs, crash recovery, lightweight baseline | 🚧 In progress — **4.9 current** |',
          )
          text = text.replace(
              'Run records remain 4.8, and general write serialization remains 4.13.',
              'Phase 4.8 adds durable `runs` as migration v2. Each run binds `document_hash + compiled_plan_id` to the exact 4.7 source-to-plan association, carries a constrained materialized run status plus monotonic created/started/finished timestamps, and optionally points to a preserved parent run through a self foreign key. Root runs cannot carry fork metadata and self-parenting is rejected; descendants may carry nullable opaque `fork_metadata_json`, but no checkpoint ID is invented before 4.11 defines checkpoints. Parent lineage deliberately does not require a child to reuse the parent\'s compiled plan, leaving future fork compatibility to the replay/checkpoint layer rather than persistence guessing. Attempt/event/checkpoint durability remain 4.9–4.11, and general write serialization remains 4.13.',
          )
          text = text.replace(
              '> **Phase 4 / Item 4.8 — Define runs and nullable `parent_run_id`/fork metadata.**',
              '> **Phase 4 / Item 4.9 — Define node attempts including iteration, attempt, status, timing, input/output refs, errors, usage, and stable logical effect/idempotency ID.**',
          )
          plan.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- harness/TODO.md harness/PLAN.md; then
            git add harness/TODO.md harness/PLAN.md
            git commit -m "docs: complete durable run lineage records"
            git push
          fi
