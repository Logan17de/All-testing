name: Zet Harness 5.9 Format Fix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format secret boundary files
        working-directory: harness
        run: npx prettier --write packages/plugin-api/src/secret-contract.test.ts packages/core/src/node-secret-accessor.ts packages/core/src/node-secret-accessor.test.ts

      - name: Verify focused secret boundary
        working-directory: harness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npx vitest run packages/plugin-api/src/secret-contract.test.ts packages/core/src/node-secret-accessor.test.ts packages/graph/src/graph-json-v1-secret-bindings.test.ts

      - name: Push exact formatter output
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/packages/plugin-api/src/secret-contract.test.ts harness/packages/core/src/node-secret-accessor.ts harness/packages/core/src/node-secret-accessor.test.ts
          git commit -m "style(secrets): format scoped secret boundary"
          git push origin HEAD:zet-harness-v1
