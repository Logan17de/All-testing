name: Zet Harness 4.21 Baseline Matrix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Run lightweight baseline
        working-directory: harness
        run: npm run baseline
