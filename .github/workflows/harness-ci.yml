name: Zet Harness 4.22 Benchmark JSON Probe

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Generate benchmark JSON
        working-directory: harness
        run: |
          npm run build --workspace @zet-harness/runtime
          npx vitest bench scripts/lightweight-baseline.bench.ts --outputJson=baseline-report.json
          node -e "const r=require('./baseline-report.json'); console.log(JSON.stringify(r,null,2))"
