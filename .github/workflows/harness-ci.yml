name: Zet Harness CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - zet-harness-v1
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"
  pull_request:
    paths:
      - "harness/**"
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        id: format
        run: npm run format:check

      - name: Model message inventory
        run: npm run inventory:check

      - name: Format failure diff
        if: failure() && steps.format.outcome == 'failure' && runner.os == 'Linux'
        run: |
          npm exec -- prettier --write .
          git diff --no-ext-diff --no-color -- .

      - name: Windows project sandbox acceptance
        if: runner.os == 'Windows'
        run: |
          npm run build --workspace @zet-harness/runtime
          npm exec -- vitest run apps/runtime/src/runtime-windows-project-sandbox.test.ts

      - name: Tests
        run: npm test

      - name: Install Linux namespace sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap meson ninja-build libcap-dev pkg-config
          # Pin the same upstream release used by local native-kernel acceptance.
          curl --fail --location --silent --show-error https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz -o "$RUNNER_TEMP/zet-bubblewrap.tar.xz"
          printf '%s  %s\n' '9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314' "$RUNNER_TEMP/zet-bubblewrap.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zet-bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/zet-bwrap-build" "$RUNNER_TEMP/bubblewrap-0.12.0" -Dman=disabled -Dtests=false -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/zet-bwrap-build"
          sudo install -m 0755 "$RUNNER_TEMP/zet-bwrap-build/bwrap" /usr/bin/bwrap
          bwrap --version
          bwrap --help | grep -- '--ro-bind-fd'
          # Ubuntu's generic userns profile strips capabilities needed to initialize
          # an isolated loopback device. Permit userns only for this root-owned binary.
          if test -f /sys/module/apparmor/parameters/enabled && grep -q '^Y' /sys/module/apparmor/parameters/enabled; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile zet-harness-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/zet-harness-bwrap > /dev/null
            sudo apparmor_parser --replace /etc/apparmor.d/zet-harness-bwrap
          fi

      - name: Native Linux kernel acceptance
        if: runner.os == 'Linux'
        run: |
          export ZET_NPM_CLI="$(dirname "$(dirname "$(command -v npm)")")/lib/node_modules/npm/bin/npm-cli.js"
          test -f "$ZET_NPM_CLI" || export ZET_NPM_CLI="$(npm root -g)/npm/bin/npm-cli.js"
          npm run test:native-linux
          node scripts/native-plugin-maker-acceptance.mjs
          # The fixed synthetic fixture also proves payload capabilities are dropped
          # when the host daemon starts as UID 0. No user project is executed.
          sudo env ZET_NPM_CLI="$ZET_NPM_CLI" "$(command -v node)" scripts/native-linux-acceptance.mjs

      - name: Plugin smoke
        run: npm run test:plugin-smoke --workspace @zet-harness/core

      - name: Startup smoke
        id: startup
        run: npm run test:startup

      - name: Native CLI acceptance
        run: node scripts/native-cli-acceptance.mjs
      - name: Build
        run: npm run build

      - name: Baseline check
        id: baseline
        env:
          ZET_BASELINE_PLATFORM: ${{ matrix.os }}
        run: npm run baseline:ci

      - name: Runtime timing diagnostics
        if: failure() && (steps.startup.outcome == 'failure' || steps.baseline.outcome == 'failure')
        timeout-minutes: 1
        run: node scripts/runtime-timing-diagnostics.mjs

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zet-harness-baseline-${{ matrix.os }}
          path: harness/tmp/baseline/*.json
          if-no-files-found: warn
          retention-days: 14
