name: Zet Harness 5.2 Format Fix

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format 5.2 identity files
        working-directory: harness
        run: npx prettier --write packages/db/src/durable-node-invocation.ts packages/db/src/durable-node-invocation.test.ts

      - name: Verify focused 5.2 surface
        working-directory: harness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build --workspace @zet-harness/db
          npx vitest run packages/db/src/durable-node-invocation.test.ts

      - name: Push exact formatter output
        shell: bash
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/packages/db/src/durable-node-invocation.ts harness/packages/db/src/durable-node-invocation.test.ts
          git commit -m "style(db): format logical effect identity"
          git push origin HEAD:zet-harness-v1
