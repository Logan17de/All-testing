name: Zet Harness 4.19 Apply

on:
  push:
    branches:
      - zet-harness-format-probe-413
    paths:
      - ".github/workflows/harness-ci.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout real Harness branch
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Recover and apply validated 4.19 patch
        run: |
          git fetch origin 2aa2e7af4ff03ad11fc7f03ca3fa05ce86652aec
          git show 2aa2e7af4ff03ad11fc7f03ca3fa05ce86652aec:.github/workflows/harness-ci.yml > /tmp/source-workflow.yml
          python - <<'PY'
          from pathlib import Path

          text = Path('/tmp/source-workflow.yml').read_text()
          start_marker = '      - name: Apply 4.19 implementation\n        run: |\n'
          end_marker = '\n      - name: Format and verify 4.19\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-419.sh').write_text(script)
          PY
          bash /tmp/apply-419.sh

      - name: Exact format affected files
        working-directory: harness
        run: npx prettier --write apps/runtime/src/runtime-health.ts apps/runtime/src/runtime-health.test.ts apps/runtime/src/runtime-http-server.ts apps/runtime/src/runtime-http-server.test.ts apps/runtime/src/runtime-daemon.ts apps/runtime/src/runtime-daemon.test.ts apps/runtime/src/index.ts

      - name: Verify through repository root
        working-directory: harness
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Commit implementation
        run: |
          git diff --check
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add harness/apps/runtime/src/runtime-health.ts harness/apps/runtime/src/runtime-health.test.ts harness/apps/runtime/src/runtime-http-server.ts harness/apps/runtime/src/runtime-http-server.test.ts harness/apps/runtime/src/runtime-daemon.ts harness/apps/runtime/src/runtime-daemon.test.ts harness/apps/runtime/src/index.ts
          git commit -m "feat(runtime): expand health checks"
          git push origin HEAD:zet-harness-v1
