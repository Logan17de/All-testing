name: Harness complete 2.8 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-8.yml"

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - name: Freeze 2.8 and advance 2.9
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      "- [ ] 2.8 Add deliberately constrained port type compatibility; do not attempt arbitrary JSON-Schema implication.",
                      "- [x] 2.8 Add deliberately constrained port type compatibility; do not attempt arbitrary JSON-Schema implication.",
                  ),
              ],
              Path("harness/README.md"): [
                  (
                      "2.8 port compatibility           ▶ CURRENT\n2.9+ liveness/compiler/IR        ⏳",
                      "2.8 port compatibility           ✅\n2.9 reachability/liveness        ▶ CURRENT\n2.10+ cycles/compiler/IR         ⏳",
                  ),
                  (
                      "The 2.6–2.7 semantic pass uses a registry-neutral `NodeManifestResolver`: semantic IDs are unique only within their own namespaces, every graph node resolves an exact pinned `type@version`, static node/port and graph-input references must exist, and required/single-vs-multiple input cardinality is enforced across bindings plus data edges. The pass is read-only and remains independent of private core registry implementations. It intentionally stops before schema compatibility, structured control-port meaning, topology/liveness, secret-only enforcement, policy semantics, and stable diagnostics.",
                      "The 2.6–2.7 semantic pass uses a registry-neutral `NodeManifestResolver`: semantic IDs are unique only within their own namespaces, every graph node resolves an exact pinned `type@version`, static node/port and graph-input references must exist, and required/single-vs-multiple input cardinality is enforced across bindings plus data edges. The pass is read-only and remains independent of private core registry implementations. 2.8 remains a separate compiler-facing compatibility stage: exact schemas, universal targets, same primitive types, impossible sources, and integer→number are the only accepted cases. Unsupported inference is rejected with an explicit compatibility diagnostic rather than guessed. Topology/liveness remains 2.9.",
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      "           ├─ 2.7 ports/cardinality/bindings          ✅\n           └─ 2.8 constrained port compatibility      ▶ CURRENT",
                      "           ├─ 2.7 ports/cardinality/bindings          ✅\n           ├─ 2.8 constrained port compatibility      ✅\n           └─ 2.9 reachability/liveness               ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.8 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.9 current** |",
                  ),
              ],
              Path("harness/GRAPH.md"): [
                  (
                      "The resolver remains a small structural `NodeManifestResolver` interface rather than a dependency on `packages/core`, so the graph/compiler package stays registry-implementation-neutral. Schema/type compatibility is deliberately reserved for 2.8; structured control-port meaning, topology/liveness, cycles, policies, secret-only enforcement, and stable diagnostics remain later passes.",
                      "The resolver remains a small structural `NodeManifestResolver` interface rather than a dependency on `packages/core`, so the graph/compiler package stays registry-implementation-neutral.\n\n### Graph JSON v1 port compatibility\n\n2.8 is a separate compiler-facing stage/API and is not merged into the 2.6–2.7 semantic validator. Its v1 rules are intentionally closed: exact schema equality, an impossible (`false`) source, a universal target, the same explicitly declared primitive type into an unconstrained target, and `integer` → `number`. Anything requiring JSON-Schema implication reasoning — including `enum`, numeric/string constraints, `allOf`, `$ref`, or constrained targets — is rejected as `GRAPH_PORT_COMPATIBILITY_UNSUPPORTED` unless the schemas are exactly equal. Unknown compatibility is never silently accepted.\n\nAn impossible (`false`) source is mathematically compatible with any target, but that says nothing about whether the producer can ever yield a live value. Reachability/liveness owns that question in 2.9; compatibility must not hide or absorb it. Structured control-port meaning, cycles, policies, secret-only enforcement, and generalized stable diagnostics remain later passes.",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected tracker text not found in {path}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit tracker transition and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harness-complete-2-8.yml
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md
          git commit -m "docs(harness): freeze 2.8 and advance 2.9"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
