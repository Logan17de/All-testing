name: Harness refresh Ajv lockfile

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-refresh-ajv-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Refresh lockfile
        working-directory: harness
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/package-lock.json
          git commit -m "build(harness): lock Ajv graph dependency"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
