name: Harness freeze validation layers

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-freeze-validation-layers.yml"

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Freeze validation ownership principle
        shell: python
        run: |
          from pathlib import Path

          graph_path = Path("harness/GRAPH.md")
          graph = graph_path.read_text(encoding="utf-8")
          old = '''V1 does not negotiate or mix schema dialects per plugin, node, port, or graph field. JSON Schema is used for **shape/value validation**. Port-to-port compatibility remains a separate Harness compiler rule with a deliberately small, deterministic compatibility model; the compiler must not attempt arbitrary JSON-Schema implication/theorem proving.\n\nValidator implementation is an internal graph-package choice and must never leak into scheduler/runtime semantics.\n'''
          new = '''V1 does not negotiate or mix schema dialects per plugin, node, port, or graph field. JSON Schema is used for **shape/value validation**. Port-to-port compatibility remains a separate Harness compiler rule with a deliberately small, deterministic compatibility model; the compiler must not attempt arbitrary JSON-Schema implication/theorem proving.\n\nValidator implementation is an internal graph-package choice and must never leak into scheduler/runtime semantics.\n\n### Validation ownership rule\n\n> **Validate each concern at the narrowest layer that actually owns it. Never promote a runtime concern into the schema validator, and never turn semantic validation into general-purpose schema reasoning.**\n\n```text\nJSON Schema validation\n= shape + local value constraints\n\nGraph semantic validation\n= harness meaning\n\nPort compatibility\n= small deterministic rules only\n\nRuntime validation\n= actual execution-time conditions\n```\n\nExamples:\n\n- JSON Schema may require a timeout value to be a positive integer.\n- Semantic validation checks that referenced node IDs, versions, ports, entrypoints, and graph relationships exist and are meaningful.\n- Port compatibility checks only explicitly supported relationships such as exact or known-safe primitive compatibility. It does not try to prove that arbitrary schema A mathematically implies schema B.\n- Runtime validation checks facts that cannot be established statically, such as whether a secret resolves or an external endpoint is reachable.\n\nThis boundary keeps diagnostics explainable, the compiler deterministic, and the default dependency/runtime surface small.\n'''
          if old not in graph:
              raise SystemExit("Expected GRAPH validation paragraph not found")
          graph_path.write_text(graph.replace(old, new, 1), encoding="utf-8", newline="\n")

          plan_path = Path("harness/PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          old = '''Compilation rejects statically knowable errors before execution:\n\n```text\nshape/schema\nidentity + versions\nports + bindings\ntypes\nreachability/liveness\ncontrol flow\npermissions\neffect/recovery policy\ntimeout/retry policy\nsecrets\nresource limits\n```\n\nInitial control-flow rule:\n'''
          new = '''Compilation rejects statically knowable errors before execution:\n\n```text\nshape/schema\nidentity + versions\nports + bindings\ntypes\nreachability/liveness\ncontrol flow\npermissions\neffect/recovery policy\ntimeout/retry policy\nsecrets\nresource limits\n```\n\nPermanent validation-ownership rule:\n\n> **Validate each concern at the narrowest layer that actually owns it. Never promote a runtime concern into the schema validator, and never turn semantic validation into general-purpose schema reasoning.**\n\n```text\nJSON Schema validation  = shape + local value constraints\nGraph semantic validation = harness meaning\nPort compatibility      = small deterministic rules only\nRuntime validation      = execution-time conditions\n```\n\nThe compiler must not attempt arbitrary JSON-Schema implication/theorem proving. Port compatibility is intentionally constrained to explicit, deterministic relationships.\n\nInitial control-flow rule:\n'''
          if old not in plan:
              raise SystemExit("Expected PLAN compiler section not found")
          plan = plan.replace(old, new, 1)
          plan = plan.replace(
              'A focused plugin smoke gate now runs explicitly in Linux and Windows CI. Phase 1 is complete; Phase 2 begins with the lightweight graph workspace before Graph JSON semantics are frozen.',
              'A focused plugin smoke gate now runs explicitly in Linux and Windows CI. Phase 1 is complete; Phase 2 has frozen Graph JSON v1 plus JSON Schema Draft 2020-12 and is moving into the validator/compiler boundary.',
              1,
          )
          plan_path.write_text(plan, encoding="utf-8", newline="\n")
      - name: Commit architecture rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/GRAPH.md harness/PLAN.md
          git commit -m "docs(harness): freeze validation ownership boundary"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
