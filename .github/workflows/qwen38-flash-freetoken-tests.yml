name: Qwen3.8 Flash FreeToken tests

on:
  push:
    paths:
      - "llm/qwen38_flash_freetoken/**"
      - "llm/pyproject.toml"
      - ".github/workflows/qwen38-flash-freetoken-tests.yml"
  pull_request:
    paths:
      - "llm/qwen38_flash_freetoken/**"
      - "llm/pyproject.toml"

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip pytest torch --index-url https://download.pytorch.org/whl/cpu
      - run: PYTHONPATH=llm pytest -q llm/qwen38_flash_freetoken/tests
