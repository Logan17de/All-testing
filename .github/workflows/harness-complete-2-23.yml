name: Harness complete 2.23 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-23.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.23 and advance 2.24
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.23 Add stable canonical hash tests.",
                      "- [x] 2.23 Add stable canonical hash tests.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.23 canonical hash tests             ▶ CURRENT\n2.24+ compiler tests                  ⏳",
                      "2.23 canonical hash tests             ✅\n2.24 golden diagnostic tests          ▶ CURRENT\n2.25 compiler stress tests            ⏳",
                  ),
                  (
                      "No fixed digest golden vectors are frozen yet; 2.23 owns stable canonical hash tests.",
                      "2.23 now freezes exact end-to-end v1 digest vectors over the real normalized-source → UI-strip → canonical-semantics → 2.22 lowering → identity pipeline. The golden fixture locks document, semantic, registry, and IR SHA-256 values, proves repeated compilation produces byte-identical canonical semantics/IR/identity, and proves editor-only changes alter only document identity. These are contract tests rather than new production behavior: future canonical byte or lowering changes must be deliberate and must revisit compiler/hash-version compatibility.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.23 canonical hash tests                              ▶ CURRENT",
                      "           ├─ 2.23 canonical hash tests                              ✅\n           └─ 2.24 golden diagnostic tests                           ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.23 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.24 current** |",
                  ),
                  (
                      "Fixed digest golden vectors remain 2.23.",
                      "2.23 now locks exact end-to-end canonical hash vectors for `harness.compiler/v1`. The fixture runs the real canonicalizer and 2.22 lowerer before recording identity, asserts fixed document/semantic/registry/IR SHA-256 outputs, recompiles cloned input to identical canonical IR and hashes, and verifies editor-only changes remain outside semantic/registry/IR identity. No production hash or lowering semantics changed in 2.23.",
                  ),
                  (
                      "> **Phase 2 / Item 2.23 — Add stable canonical hash tests.**",
                      "> **Phase 2 / Item 2.24 — Add invalid-graph golden diagnostic tests.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "2.21 does not lower Graph JSON into IR and does not define hard-coded digest golden vectors. 2.22 owns DAG/router/join lowering; 2.23 owns stable canonical hash vectors/tests.",
                      "2.21 does not lower Graph JSON into IR; 2.22 owns DAG/router/join lowering. 2.23 now freezes exact `harness.compiler/v1` hash vectors in `compiler-identity-v1.golden.test.ts` using the real canonicalization and lowering pipeline. The fixture locks all four domain-separated SHA-256 outputs, proves cloned identical input produces identical canonical semantics/IR/identity, and proves editor-only changes affect `documentHash` while the semantic, registry, and IR golden hashes remain unchanged. This adds no new production hash semantics; a future intentional canonical-byte or lowering change must update the compatibility/version contract rather than casually rewriting the vectors.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-23.yml
          git commit -m "docs(harness): freeze 2.23 and advance 2.24"
          git push origin HEAD:zet-harness-v1
