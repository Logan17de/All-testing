name: Harness complete 3.1 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-3-1.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 3.1 and advance 3.2
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 3.1 Add run-local op status state machine: pending/ready/running/completed/skipped/waiting/retry-wait/failed/cancelled.",
                      "- [x] 3.1 Add run-local op status state machine: pending/ready/running/completed/skipped/waiting/retry-wait/failed/cancelled.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "3.1 op status state machine            ▶ CURRENT",
                      "3.1 op status state machine            ✅\n3.2 readiness queue + dependency counters ▶ CURRENT",
                  ),
                  (
                      "Validation ownership is permanently separated:",
                      "Phase 3 now has an explicit `@zet-harness/scheduler` workspace. Item 3.1 freezes the run-local op status vocabulary and legal transition contract without adding scheduling behavior: every op starts `pending`; `pending` may become `ready`, `skipped`, or `cancelled`; `ready` may become `running`, `skipped`, or `cancelled`; `running` may become `completed`, `skipped`, `waiting`, `retry-wait`, `failed`, or `cancelled`; `waiting` and `retry-wait` may return to `ready` or be cancelled; and `completed`, `skipped`, `failed`, and `cancelled` are terminal. Status arrays, transition tables, and returned op-state objects are runtime-frozen. The transition helpers are pure and carry only the zero-based Execution IR op index plus status. Readiness/dependency accounting begins in 3.2; branch activation, retry timers, cancellation signals, executor dispatch, and persistence remain later items.\n\nValidation ownership is permanently separated:",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           └─ 3.1 op status state machine                              ▶ CURRENT",
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           ├─ 3.1 op status state machine                              ✅\n           └─ 3.2 readiness queue + dependency counters                ▶ CURRENT",
                  ),
                  (
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.1 current** |",
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.2 current** |",
                  ),
                  (
                      "> **Phase 3 / Item 3.1 — Add the run-local op status state machine.**",
                      "> **Phase 3 / Item 3.2 — Add the readiness queue and dependency counters.**",
                  ),
              ],
              "harness/RUNTIME.md": [
                  (
                      "No distributed scheduler is required.\n\n## Plugin relationship",
                      "No distributed scheduler is required.\n\n## Scheduler state contract\n\nThe framework-free in-memory scheduler lives in its own `@zet-harness/scheduler` workspace. Item 3.1 freezes only the run-local op state machine; it does not yet implement a queue or executor loop. Each op is identified by its zero-based Execution IR index and begins `pending`.\n\n```text\npending → ready → running\n   │         │       ├→ completed\n   │         │       ├→ skipped\n   │         │       ├→ waiting → ready\n   │         │       ├→ retry-wait → ready\n   │         │       ├→ failed\n   │         │       └→ cancelled\n   │         ├→ skipped\n   │         └→ cancelled\n   ├→ skipped\n   └→ cancelled\n```\n\n`completed`, `skipped`, `failed`, and `cancelled` are terminal. Self-transitions and phase-skipping transitions are rejected. The exported status arrays, transition tables, and produced state objects are runtime-frozen so plugin/consumer code cannot mutate scheduler invariants. Readiness and dependency counters land in 3.2; later Phase-3 items decide when legal transitions occur.\n\n## Plugin relationship",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md RUNTIME.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-3-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/RUNTIME.md .github/workflows/harness-complete-3-1.yml
          git commit -m "docs(harness): freeze 3.1 and advance 3.2"
          git push origin HEAD:zet-harness-v1
