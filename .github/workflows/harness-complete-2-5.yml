name: Harness complete 2.5 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-5.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Complete 2.5 and advance to 2.6
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 2.5 Add shape/schema validation.',
                      '- [x] 2.5 Add shape/schema validation.',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 2.5 shape/schema validation             ▶ CURRENT',
                      '           ├─ 2.5 shape/schema validation             ✅\n           └─ 2.6 semantic IDs + node resolution       ▶ CURRENT',
                  ),
                  (
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.5 current** |',
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.6 current** |',
                  ),
                  (
                      '> **Phase 2 / Item 2.5 — Add Graph JSON v1 shape/schema validation through the isolated Draft 2020-12 boundary.**',
                      '> **Phase 2 / Item 2.6 — Add semantic validation for unique IDs and exact node type/version resolution.**',
                  ),
              ],
              Path("harness/README.md"): [
                  (
                      '2.5 shape/schema validation     ▶ CURRENT\n2.6+ semantic/compiler/IR       ⏳',
                      '2.5 shape/schema validation     ✅\n2.6 semantic IDs/node resolution ▶ CURRENT\n2.7+ ports/compiler/IR          ⏳',
                  ),
              ],
              Path("harness/GRAPH.md"): [
                  (
                      'The internal engine is created with strict schema checking, all-errors collection, and format assertions disabled. Draft 2020-12 treats formats as annotations unless an assertion vocabulary is deliberately enabled, so v1 does not add `ajv-formats` without a concrete product need.',
                      'The internal engine is created with strict schema checking, all-errors collection, and format assertions disabled. Draft 2020-12 treats formats as annotations unless an assertion vocabulary is deliberately enabled, so v1 does not add `ajv-formats` without a concrete product need.\n\n### Graph JSON v1 shape validator\n\n`@zet-harness/graph` exports the Draft 2020-12 `GRAPH_JSON_V1_SCHEMA` plus `validateGraphJsonV1Shape(value)`. The validator accepts `unknown` and narrows it to `GraphJsonV1` only when the portable document structure and local value constraints are valid.\n\nThis pass intentionally does **not** reject duplicate IDs, unresolved node references, nonexistent ports, incompatible connections, cycles, or policy semantics. Those belong to later semantic passes. Ajv error objects also remain private implementation details here; stable Harness diagnostics are introduced separately in item 2.16.',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md harness/README.md harness/GRAPH.md
          git commit -m "docs(harness): complete Graph JSON shape validation"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
