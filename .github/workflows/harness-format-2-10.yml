name: Harness format 2.10

on:
  push:
    branches: [zet-harness-v1]
    paths:
      - ".github/workflows/harness-format-2-10.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - name: Format 2.10 source
        working-directory: harness
        run: npx prettier --write packages/graph/src/graph-json-v1-acyclicity.ts
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          git rm .github/workflows/harness-format-2-10.yml
          git add harness/packages/graph/src/graph-json-v1-acyclicity.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(harness): format 2.10 acyclicity source"
          git push origin HEAD:zet-harness-v1
