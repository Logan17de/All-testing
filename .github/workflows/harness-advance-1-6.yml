name: Harness advance 1.6 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-advance-1-6.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance TODO and PLAN
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 1.6 Freeze the universal `NodeDefinition`/`NodeManifest` contract.',
                      '- [x] 1.6 Freeze the universal `NodeDefinition`/`NodeManifest` contract.',
                  ),
                  (
                      '**1.6 — Freeze the universal `NodeDefinition`/`NodeManifest` contract.**',
                      '**1.7 — Include node input/config/output schemas in the manifest.**',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 1.6 node contract             ▶ CURRENT',
                      '           ├─ 1.6 node contract             ✅\n           └─ 1.7 node schemas              ▶ CURRENT',
                  ),
                  ('**1.6 current**', '**1.7 current**'),
                  (
                      '> **Phase 1 / Item 1.6 — Freeze the universal `NodeDefinition`/`NodeManifest` contract.**',
                      '> **Phase 1 / Item 1.7 — Include node input/config/output schemas in the manifest.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): complete node contract milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
