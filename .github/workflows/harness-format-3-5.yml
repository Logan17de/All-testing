name: Harness format 3.5

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-3-5.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format 3.5 files
        working-directory: harness
        run: npx prettier --write packages/scheduler/src/router-activation.ts packages/scheduler/src/router-activation.test.ts packages/scheduler/src/index.ts

      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/harness-format-3-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/scheduler/src/router-activation.ts harness/packages/scheduler/src/router-activation.test.ts harness/packages/scheduler/src/index.ts .github/workflows/harness-format-3-5.yml
          git commit -m "style(harness): format 3.5 router activation"
          git push origin HEAD:zet-harness-v1
