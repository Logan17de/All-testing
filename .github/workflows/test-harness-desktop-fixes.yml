name: Test Harness Desktop Fixes

on:
  push:
    branches:
      - harness-desktop-v1-fixes
    paths:
      - 'harness-desktop/**'
      - '.github/workflows/test-harness-desktop-fixes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-desktop-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harness-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@11.24.0 --no-audit --no-fund

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run real-engine and Electron smoke tests
        run: pnpm run test:e2e
