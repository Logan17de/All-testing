name: Harness complete 2.6 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-6.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Complete 2.6 and advance to 2.7
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 2.6 Add semantic validation for unique IDs and node type/version resolution.',
                      '- [x] 2.6 Add semantic validation for unique IDs and node type/version resolution.',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 2.6 semantic IDs + node resolution       ▶ CURRENT',
                      '           ├─ 2.6 semantic IDs + node resolution       ✅\n           └─ 2.7 ports/cardinality/bindings          ▶ CURRENT',
                  ),
                  (
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.6 current** |',
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.7 current** |',
                  ),
                  (
                      '> **Phase 2 / Item 2.6 — Add semantic validation for unique IDs and exact node type/version resolution.**',
                      '> **Phase 2 / Item 2.7 — Add port existence, cardinality, and binding validation.**',
                  ),
              ],
              Path("harness/README.md"): [
                  (
                      '2.6 semantic IDs/node resolution ▶ CURRENT\n2.7+ ports/compiler/IR          ⏳',
                      '2.6 semantic IDs/node resolution ✅\n2.7 ports/cardinality/bindings  ▶ CURRENT\n2.8+ compatibility/compiler/IR  ⏳',
                  ),
              ],
              Path("harness/GRAPH.md"): [
                  (
                      'This pass intentionally does **not** reject duplicate IDs, unresolved node references, nonexistent ports, incompatible connections, cycles, or policy semantics. Those belong to later semantic passes. Ajv error objects also remain private implementation details here; stable Harness diagnostics are introduced separately in item 2.16.\n\nAjv error objects are not part of any public contract. Shape validation will translate them into Harness-owned diagnostics when item 2.5 lands. Replacing Ajv later must not require changing Graph JSON, plugin manifests, compiler semantics, scheduler behavior, or runtime records.',
                      'This pass intentionally does **not** reject duplicate IDs, unresolved node references, nonexistent ports, incompatible connections, cycles, or policy semantics. Those belong to later semantic passes. Ajv error objects also remain private implementation details here; stable Harness diagnostics are introduced separately in item 2.16.\n\n### Graph JSON v1 semantic identity validator\n\n`validateGraphJsonV1Semantics(graph, resolver)` owns the narrow 2.6 semantic layer: IDs must be unique inside each semantic namespace (`inputs`, `outputs`, `nodes`, `edges`, and `entrypoints`), and every node must resolve an exact pinned `type@version`. IDs are not globally unique across namespaces.\n\nThe resolver is a small structural `NodeManifestResolver` interface rather than a dependency on `packages/core`, so the graph/compiler package remains registry-implementation-neutral. Port existence/cardinality, graph references, compatibility, topology, cycles, policies, and stable diagnostics remain later passes.\n\nAjv error objects are not part of any public contract. Stable Harness-owned diagnostics are introduced in item 2.16. Replacing Ajv later must not require changing Graph JSON, plugin manifests, compiler semantics, scheduler behavior, or runtime records.',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md harness/README.md harness/GRAPH.md
          git commit -m "docs(harness): complete semantic ID validation"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
