name: Harness 5.5 Format Repair

on:
  push:
    branches: [zet-harness-v1]
    paths:
      - .github/workflows/harness-5-5-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - name: Format 5.5 files
        working-directory: harness
        run: npx prettier --write packages/core/src/capability-permission-policy.ts packages/core/src/capability-permission-policy.test.ts
      - name: Commit exact formatting and remove helper
        shell: bash
        run: |
          rm .github/workflows/harness-5-5-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/core/src/capability-permission-policy.ts harness/packages/core/src/capability-permission-policy.test.ts .github/workflows/harness-5-5-format.yml
          git commit -m "style(core): format capability permission policy"
          git push origin HEAD:zet-harness-v1
