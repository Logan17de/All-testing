name: Harness advance 1.9 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-advance-1-9.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance TODO and PLAN
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 1.9 Ensure manifests can be inspected without executing plugin node code.',
                      '- [x] 1.9 Ensure manifests can be inspected without executing plugin node code.',
                  ),
                  (
                      '**1.9 — Ensure manifests can be inspected without executing plugin node code.**',
                      '**1.10 — Prove one built-in plugin and one external/local test plugin use the exact same host/registry path.**',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 1.9 static manifest inspection  ▶ CURRENT',
                      '           ├─ 1.9 static manifest inspection  ✅\n           └─ 1.10 built-in/external parity    ▶ CURRENT',
                  ),
                  ('**1.9 current**', '**1.10 current**'),
                  (
                      'A node manifest carries versioned identity, input/config/output schemas, primitive family, determinism, effect/idempotency and recovery policy, timeout/retry defaults, execution mode, and required capabilities. The next step proves this static manifest can be inspected without executing node implementation code.',
                      'A node manifest carries versioned identity, input/config/output schemas, primitive family, determinism, effect/idempotency and recovery policy, timeout/retry defaults, execution mode, and required capabilities. `NodeCatalog` provides a manifest-only inspection path keyed by node type + version, proven not to invoke node executors. The next step proves built-in and external/local plugins register through the same host/catalog path.',
                  ),
                  (
                      '> **Phase 1 / Item 1.9 — Ensure manifests can be inspected without executing plugin node code.**',
                      '> **Phase 1 / Item 1.10 — Prove one built-in plugin and one external/local test plugin use the exact same host/registry path.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): complete static manifest milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
