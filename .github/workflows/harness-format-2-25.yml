name: Harness format 2.25

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-2-25.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format 2.25 file
        working-directory: harness
        run: npx prettier --write packages/graph/src/graph-json-v1-compiler.stress.test.ts

      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/harness-format-2-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/graph/src/graph-json-v1-compiler.stress.test.ts .github/workflows/harness-format-2-25.yml
          git commit -m "style(harness): format 2.25 stress tests"
          git push origin HEAD:zet-harness-v1
