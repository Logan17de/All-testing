name: Harness complete 2.14 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-14.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.14 and advance 2.15
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.14 Add compile-time side-effect/retry/recovery validation.",
                      "- [x] 2.14 Add compile-time side-effect/retry/recovery validation.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.14 side-effect/retry/recovery   ▶ CURRENT\n2.15+ validation/compiler/IR      ⏳",
                      "2.14 side-effect/retry/recovery   ✅\n2.15 secret-only enforcement       ▶ CURRENT\n2.16+ validation/compiler/IR       ⏳",
                  ),
                  (
                      "2.13 separately validates capability/policy semantics: hard capability demand is graph `required` plus manifest `requiredCapabilities`; graph `optional` is opportunistic; graph `deny` only subtracts authority; and all requested authority is intersected with explicit external compile grants. Graph JSON never self-grants. Duplicate/cross-bucket capability intent is rejected, and a loop bound already exceeding graph `maxNodeExecutions` is rejected as a static policy contradiction. Runtime policy may always be stricter.",
                      "2.13 separately validates capability/policy semantics: hard capability demand is graph `required` plus manifest `requiredCapabilities`; graph `optional` is opportunistic; graph `deny` only subtracts authority; and all requested authority is intersected with explicit external compile grants. Graph JSON never self-grants. Duplicate/cross-bucket capability intent is rejected, and a loop bound already exceeding graph `maxNodeExecutions` is rejected as a static policy contradiction. Runtime policy may always be stricter. 2.14 separately validates node side-effect/idempotency/retry/recovery consistency: determinism never grants retry safety, external reads must be side-effect-idempotent, external writes must explicitly declare idempotency, unknown-idempotency writes cannot auto-retry or recover by rerun, reconcile is reserved for external writes, compile-only nodes cannot carry runtime retry/recovery policy, and retry numeric bounds are validated without normalization. The Harness still never claims exactly-once execution for arbitrary external effects.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.14 side-effect/retry/recovery validation ▶ CURRENT",
                      "           ├─ 2.14 side-effect/retry/recovery validation ✅\n           └─ 2.15 secret-only enforcement              ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.14 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.15 current** |",
                  ),
                  (
                      "Side effects are explicit. The contract must distinguish determinism, effect class, idempotency, and recovery policy. Never claim exactly-once execution for arbitrary third-party effects.",
                      "Side effects are explicit. The contract distinguishes determinism, effect class, idempotency, retry defaults, and recovery policy. Compile-time validation keeps determinism separate from repeat safety: a deterministic external write is not automatically safe to retry, while a nondeterministic external read may still be side-effect-idempotent. Unknown-idempotency external writes cannot declare automatic retry beyond one attempt or automatic rerun recovery; idempotent/idempotency-key writes may declare controlled retries. Reconcile recovery is reserved for external writes, and compile-time/control nodes without executors cannot carry runtime retry/recovery defaults. Never claim exactly-once execution for arbitrary third-party effects.",
                  ),
                  (
                      "> **Phase 2 / Item 2.14 — Add compile-time side-effect/retry/recovery validation.**",
                      "> **Phase 2 / Item 2.15 — Reject literal secrets where a secret reference is required.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "2.13 also performs the first deliberately narrow resource-policy cross-check promised by 2.12: when `policies.maxNodeExecutions` exists, a valid structured-loop `config.maxIterations` greater than that ceiling is rejected because the graph already contradicts its own hard execution budget. No scheduler accounting, wall-time prediction, or parallelism simulation is attempted here. Side-effect/retry/recovery consistency remains 2.14; secret-only enforcement remains 2.15; generalized stable diagnostics remain 2.16.\n\nAjv error objects are not part of any public contract.",
                      "2.13 also performs the first deliberately narrow resource-policy cross-check promised by 2.12: when `policies.maxNodeExecutions` exists, a valid structured-loop `config.maxIterations` greater than that ceiling is rejected because the graph already contradicts its own hard execution budget. No scheduler accounting, wall-time prediction, or parallelism simulation is attempted here.\n\n### Graph JSON v1 side-effect/retry/recovery validation\n\n2.14 is a separate compile-time stage over resolved `NodeManifest.behavior`. Effect class and primitive family must agree: `effect: none` cannot masquerade as an effect-family operation, while `external-read`/`external-write` require the effect primitive family and a runtime execution mode. No-effect nodes use `idempotency: not-applicable`; external reads are treated as side-effect-idempotent even when their returned data is nondeterministic; external writes must explicitly declare `idempotent`, `idempotency-key`, or `unknown`.\n\nDeterminism and repeat safety are intentionally independent. A deterministic external write with unknown idempotency is still unsafe to repeat. If an external write declares `idempotency: unknown`, automatic retry beyond one attempt is rejected and `recovery: rerun` is rejected. `reconcile` recovery is meaningful only for external writes. Nodes with `executionMode: none` must use `recovery: not-applicable` and cannot declare runtime retry defaults; executable nodes must declare a non-`not-applicable` recovery policy. Retry `maxAttempts` must be a positive safe integer and optional `backoffMs` a non-negative safe integer.\n\nThis stage validates manifest promises only. It does not execute retries, generate idempotency keys, reconcile external systems, decide durable resume state, or claim exactly-once behavior. Those runtime mechanics remain later phases. Secret-only binding enforcement remains 2.15; generalized stable diagnostics remain 2.16.\n\nAjv error objects are not part of any public contract.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:140]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-14.yml
          git commit -m "docs(harness): freeze 2.14 and advance 2.15"
          git push origin HEAD:zet-harness-v1
