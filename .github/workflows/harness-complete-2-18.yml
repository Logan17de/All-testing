name: Harness complete 2.18 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-18.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.18 and advance 2.19
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.18 Strip UI-only metadata during compilation.",
                      "- [x] 2.18 Strip UI-only metadata during compilation.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.18 UI metadata stripping            ▶ CURRENT\n2.19+ compiler/IR                     ⏳",
                      "2.18 UI metadata stripping            ✅\n2.19 canonical source semantics       ▶ CURRENT\n2.20+ compiler/IR                     ⏳",
                  ),
                  (
                      "No digest, hash, UI stripping, canonical ordering, or IR lowering is performed here.",
                      "No digest, hash, UI stripping, canonical ordering, or IR lowering is performed here. 2.18 then creates compiler-facing source with `stripGraphJsonV1UiMetadata`: it removes only the top-level semantically inert `editor` bucket while preserving graph/revision identity, human metadata, normalized executable fields, node/plugin pins, and source ordering. Editor-like keys inside node config are not recursively stripped. Inputs that differ only in editor state therefore produce identical 2.18 compiler source. Document/semantic hash domains, semantic projection, and canonical ordering remain later items beginning with 2.19.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.18 UI metadata stripping                      ▶ CURRENT",
                      "           ├─ 2.18 UI metadata stripping                      ✅\n           └─ 2.19 canonical source semantics                   ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.18 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.19 current** |",
                  ),
                  (
                      "2.17 does not strip editor metadata or reorder source collections; those remain 2.18 and 2.19 respectively. Hashes, digests, registry identity, and IR lowering remain later compiler items.",
                      "2.17 does not strip editor metadata or reorder source collections; those remain 2.18 and 2.19 respectively. 2.18 removes only the top-level Graph JSON `editor` bucket from compiler-facing source; human metadata, document identity, normalized fields, resolved pins, and source ordering remain intact. The stripping stage is pure and does not recursively delete config keys named `editor`. Hash domains, semantic projection, canonical ordering, digests, registry identity, and IR lowering remain later compiler items starting with 2.19.",
                  ),
                  (
                      "> **Phase 2 / Item 2.18 — Strip UI-only metadata during compilation.**",
                      "> **Phase 2 / Item 2.19 — Canonicalize source semantics deterministically.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "2.17 deliberately preserves graph/editor metadata and source collection order. 2.18 owns removal of UI-only editor state, while 2.19 owns deterministic canonical ordering/serialization. This stage does not compute package digests, registry/compiler hashes, semantic/document hashes, or Execution IR; those remain later compiler items.\n\n## Graph JSON v1",
                      "2.17 deliberately preserves graph/editor metadata and source collection order. 2.18 owns removal of UI-only editor state, while 2.19 owns deterministic canonical ordering/serialization. This stage does not compute package digests, registry/compiler hashes, semantic/document hashes, or Execution IR; those remain later compiler items.\n\n### Graph JSON v1 compiler UI-metadata stripping\n\n2.18 introduces `stripGraphJsonV1UiMetadata(normalized)`, a pure compiler stage over 2.17 output. It returns `GraphCompilerSourceV1`, carrying the normalized document without its top-level `editor` property plus the exact node/plugin pins established by 2.17. The editable/normalized source is not mutated.\n\nThe stripping rule is deliberately narrow: the entire top-level `GraphEditorMetadataV1` bucket is excluded, including viewport, node positions/collapse state, annotations, and arbitrary editor `data`. Human-facing `metadata`, `graphId`, `revisionId`, policies/options, executable node config, bindings, edges, entrypoints, and resolved pins remain present. A property named `editor` inside node config is ordinary executable config and is not recursively removed. Therefore two normalized sources that differ only in top-level editor state produce the same 2.18 compiler-facing source.\n\n2.18 does not canonicalize or reorder collections, project `GraphSemanticsV1`, compute document/semantic/registry/IR hashes, or lower Execution IR. Source order is preserved for 2.19, which owns deterministic canonical source semantics. The separate document-hash domain remains free to cover the complete normalized editable document, while executable semantic identity will exclude editor state by construction.\n\n## Graph JSON v1",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-18.yml
          git commit -m "docs(harness): freeze 2.18 and advance 2.19"
          git push origin HEAD:zet-harness-v1
