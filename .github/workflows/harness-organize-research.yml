name: Harness organize research

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-organize-research.yml"

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - name: Move and mark research as non-authoritative
        shell: python
        run: |
          from pathlib import Path

          src = Path("harness/deep-research-report (2).md")
          dst = Path("harness/research/visual-graph-research-2.md")
          dst.parent.mkdir(parents=True, exist_ok=True)
          text = src.read_text(encoding="utf-8")
          header = """# Research Reference — Not Architecture Authority\n\n> This is preserved source research, not an implementation specification. Accepted Zet Harness decisions live in `../LIGHTWEIGHT.md`, `../PLUGINS.md`, `../RUNTIME.md`, `../GRAPH.md`, `../PLAN.md`, and `../TODO.md`. In particular, the Rust runtime recommendation below was evaluated but is **not adopted** for the current lightweight build; the accepted runtime is the Node 24 daemon + built-in SQLite design in `RUNTIME.md`.\n\n---\n\n"""
          dst.write_text(header + text, encoding="utf-8")
          src.unlink()

      - name: Commit organized research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'harness/deep-research-report (2).md' harness/research/visual-graph-research-2.md
          git commit -m "docs(harness): quarantine raw visual graph research"
          git push origin HEAD:zet-harness-v1
