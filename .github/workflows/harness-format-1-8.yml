name: Harness format 1.8

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-1-8.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: harness
      - name: Format node contract
        run: npx prettier --write packages/plugin-api/src/index.ts
        working-directory: harness
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/plugin-api/src/index.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(harness): format node behavior contract"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
