name: Harness complete 3.3 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-3-3.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 3.3 and advance 3.4
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 3.3 Add bounded global/per-run concurrency using native Promises/semaphores.",
                      "- [x] 3.3 Add bounded global/per-run concurrency using native Promises/semaphores.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "3.3 bounded global/per-run concurrency   ▶ CURRENT",
                      "3.3 bounded global/per-run concurrency   ✅\n3.4 concurrent DAG branches              ▶ CURRENT",
                  ),
                  (
                      "Queue dequeue reserves a ready op without transitioning it to `running`; 3.3 owns concurrency admission/dispatch.",
                      "Queue dequeue reserves a ready op without transitioning it to `running`; 3.3 owns concurrency admission primitives while 3.4 owns queue/dispatch integration and the first `ready → running` execution path.",
                  ),
                  (
                      "Completion, skip, control activation, failure propagation, retry timing, cancellation, and persistence remain later Phase-3/runtime concerns. The scheduler imports Execution IR only as a type/development dependency, keeping compiler/Ajv packages out of its runtime dependency chain.",
                      "Completion, skip, control activation, failure propagation, retry timing, cancellation, and persistence remain later Phase-3/runtime concerns. The scheduler imports Execution IR only as a type/development dependency, keeping compiler/Ajv packages out of its runtime dependency chain.\n\nItem 3.3 adds native-Promise concurrency admission without starting the executor loop. `AsyncSemaphore` is a FIFO bounded semaphore with runtime-frozen permits/snapshots and duplicate-release protection. `SchedulerConcurrency` owns one runtime-global semaphore; every `RunConcurrency` owns an independent per-run semaphore derived from compiled `policies.maxParallelism`, inheriting the global limit when that policy is omitted. A run acquires its local permit before the global permit so work already blocked by its own run ceiling cannot hoard global slots. Combined release returns the global slot first, then the run-local slot. Separate runs therefore share one hard global ceiling while preserving independent local queues. 3.3 adds no timeout, abort-aware waiter removal, retries, executor calls, or DAG dispatch loop; cancellation-aware waits remain 3.9 and actual concurrent branch execution begins in 3.4.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           ├─ 3.1 op status state machine                              ✅\n           ├─ 3.2 readiness queue + dependency counters                ✅\n           └─ 3.3 bounded global/per-run concurrency                   ▶ CURRENT",
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           ├─ 3.1 op status state machine                              ✅\n           ├─ 3.2 readiness queue + dependency counters                ✅\n           ├─ 3.3 bounded global/per-run concurrency                   ✅\n           └─ 3.4 concurrent DAG branches                              ▶ CURRENT",
                  ),
                  (
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.3 current** |",
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.4 current** |",
                  ),
                  (
                      "> **Phase 3 / Item 3.3 — Add bounded global/per-run concurrency using native Promises/semaphores.**",
                      "> **Phase 3 / Item 3.4 — Execute independent DAG branches concurrently.**",
                  ),
              ],
              "harness/RUNTIME.md": [
                  (
                      "Dequeue removes one FIFO-ready reservation but leaves its state `ready`; 3.3 owns concurrency admission and the later `ready → running` dispatch transition. 3.2 does not decide which completion/skip/control outcomes satisfy dependencies, and it adds no concurrency, executor calls, retry timers, cancellation signals, or persistence.",
                      "Dequeue removes one FIFO-ready reservation but leaves its state `ready`; 3.3 owns the concurrency admission primitives, while 3.4 owns combining queue reservation with the first `ready → running` executor path. 3.2 does not decide which completion/skip/control outcomes satisfy dependencies, and it adds no concurrency, executor calls, retry timers, cancellation signals, or persistence.\n\nItem 3.3 adds a framework-free FIFO `AsyncSemaphore` plus scheduler-global and per-run admission gates. The runtime chooses one positive global limit. Each run gets an independent local limit from compiled `policies.maxParallelism`, or inherits the global ceiling when omitted. Run-local admission happens before global admission so a run stalled at its own limit does not consume a global slot while waiting. Once both permits are held, the work counts against both limits until the combined permit is released; global capacity is returned before local capacity to favor cross-run progress. Permit and snapshot objects are runtime-frozen and duplicate release is rejected before accounting can underflow. This layer remains admission-only: it does not dequeue work, transition op status, invoke executors, add timeouts/retries, or remove aborted waiters. Concurrent DAG dispatch starts in 3.4 and AbortSignal-aware waiter cancellation remains 3.9.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md RUNTIME.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-3-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/RUNTIME.md .github/workflows/harness-complete-3-3.yml
          git commit -m "docs(harness): freeze 3.3 and advance 3.4"
          git push origin HEAD:zet-harness-v1
