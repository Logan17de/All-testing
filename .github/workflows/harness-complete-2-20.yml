name: Harness complete 2.20 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-20.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.20 and advance 2.21
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.20 Define compact immutable Execution IR v1 with indexed ops and resolved references.",
                      "- [x] 2.20 Define compact immutable Execution IR v1 with indexed ops and resolved references.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.20 Execution IR v1                  ▶ CURRENT\n2.21+ compiler/hashes                 ⏳",
                      "2.20 Execution IR v1                  ✅\n2.21 hashes/compiler identity         ▶ CURRENT\n2.22+ IR lowering/tests               ⏳",
                  ),
                  (
                      "Resolved node/plugin pins are sorted separately for later registry identity and are not folded into `canonicalSemanticsJson`. 2.19 computes no hashes and lowers no IR; Execution IR starts at 2.20 and hash/compiler/registry identity remains 2.21.",
                      "Resolved node/plugin pins are sorted separately for later registry identity and are not folded into `canonicalSemanticsJson`. 2.19 computes no hashes and lowers no IR. 2.20 now freezes the compact immutable `harness.ir/v1` contract: array position is the authoritative zero-based identity for ops, graph inputs, and entrypoints; graph node/input references inside execution data are resolved to numeric indexes; op-output, control-edge, graph-output, entrypoint, and default-entrypoint references are range-checked; dependency indexes must be strictly increasing, unique, and non-self; runtime-needed config, input sources, behavior, resource/capability intent, and structured-control descriptors remain; source schemas, graph/revision/human/editor metadata, external capability grants, hashes/compiler identity, and provenance pins are not copied into the 2.20 plan. `createExecutionIrV1` structured-clones and deeply freezes an internal compiler-produced candidate, so bad indexes are compiler invariant failures rather than new user-facing Graph diagnostics. 2.20 defines no Graph-to-IR lowering; 2.22 owns DAG/router/join lowering. Hash/compiler/registry identity remains 2.21.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.20 Execution IR v1                              ▶ CURRENT",
                      "           ├─ 2.20 Execution IR v1                              ✅\n           └─ 2.21 hashes/compiler identity                         ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.20 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.21 current** |",
                  ),
                  (
                      "No digest is computed in 2.19; Execution IR begins in 2.20 and document/semantic/registry/IR hashes remain 2.21.",
                      "No digest is computed in 2.19. 2.20 defines `harness.ir/v1` as compact immutable executable-plan state: op, graph-input, and entrypoint array positions are authoritative index domains; internal node/input references become numeric indexes; runtime-needed config/value sources/static behavior/policies remain; control edges and structured-control contracts have indexed/compact IR shapes ready for later lowering; compiler candidates are range-checked then structured-cloned and deeply frozen. Source schemas/metadata, capability grants, hash/compiler identity, and provenance pins stay outside this 2.20 core. No Graph-to-IR lowering happens here: 2.22 owns DAG dependencies plus router/join lowering, while document/semantic/registry/IR hashes and compiler identity remain 2.21.",
                  ),
                  (
                      "> **Phase 2 / Item 2.20 — Define compact immutable Execution IR v1 with indexed ops and resolved references.**",
                      "> **Phase 2 / Item 2.21 — Record document hash, semantic hash, IR hash, compiler version, registry hash, and pinned node versions.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "2.19 remains pre-IR and pre-hash: 2.20 owns compact immutable Execution IR v1, while 2.21 owns document hash, semantic hash, registry/compiler identity, and IR hash.\n\n## Graph JSON v1",
                      "2.19 remains pre-IR and pre-hash: 2.20 owns compact immutable Execution IR v1, while 2.21 owns document hash, semantic hash, registry/compiler identity, and IR hash.\n\n### Execution IR v1\n\n2.20 introduces the internal `ExecutionIrV1` contract, self-identified by `format: \"harness.ir/v1\"`. It is executable-plan state rather than a second Graph JSON document. The zero-based position inside `ops`, `graphInputs`, and `entrypoints` is the authoritative index; there is deliberately no redundant `index` field that could disagree with array position. `sourceNodeId` remains on each op only for tracing/inspection. Internal graph-input references use graph-input indexes, node-to-node value flow uses `{ kind: \"op-output\", op, port }`, graph outputs point to op indexes, control endpoints point to op indexes, entrypoints point to op indexes, and `defaultEntrypoint` is an entrypoint index.\n\nEach op retains the runtime material already proven safe by earlier compiler stages: pinned source `type@version`, executable config, ordered resolved value sources, precomputed predecessor indexes, scheduler/effect/retry/recovery/execution behavior, required capabilities, and an optional static structured-control descriptor. Graph-level runtime policy retains resource ceilings plus required/optional/deny capability intent. External capability grants/effective authority are never embedded because Graph JSON cannot self-grant and runtime policy may be stricter. JSON Schemas/manifests and graph/revision/human/editor metadata are not duplicated into the compact IR core; durable source and registry identity remain separate records/domains.\n\n`ExecutionIrControlDescriptorV1` reserves the already-frozen router, all-active join, loop, human-interrupt, and subgraph control shapes, while indexed `controlEdges` preserve activation/ordering endpoints. This reservation does not implement branch selection, join activation, loop execution, human suspension, or subgraph invocation. In particular it does not weaken 2.10 SCC rejection. 2.22 owns actual lowering of basic DAG dependencies plus router/join descriptors into these shapes.\n\n`createExecutionIrV1(candidate)` is an internal invariant boundary, not a new Graph validation pass. It checks that every op/graph-input/control/entrypoint numeric reference is in range, requires dependency lists to be strictly increasing and unique, rejects self-dependencies, then `structuredClone`s and deeply freezes the plan. The caller's candidate is not mutated or frozen. Invalid references at this point indicate a compiler bug because user-facing shape/semantic/policy validation has already succeeded.\n\n2.20 deliberately contains no document hash, semantic hash, registry hash, compiler version, IR hash, or provenance pins; 2.21 owns those identities. It also performs no Graph-to-IR compilation/lowering; 2.22 owns that transformation.\n\n## Graph JSON v1",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-20.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-20.yml
          git commit -m "docs(harness): freeze 2.20 and advance 2.21"
          git push origin HEAD:zet-harness-v1
