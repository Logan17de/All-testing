name: Harness advance 1.8 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-advance-1-8.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance TODO and PLAN
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 1.8 Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.',
                      '- [x] 1.8 Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.',
                  ),
                  (
                      '- [ ] 5.1 Freeze exact node enums/contracts for determinism, effect class, idempotency, and recovery policy.',
                      '- [ ] 5.1 Define and enforce cross-field effect/idempotency/recovery invariants over the Phase 1 node enums.',
                  ),
                  (
                      '**1.8 — Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.**',
                      '**1.9 — Ensure manifests can be inspected without executing plugin node code.**',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 1.8 behavior metadata          ▶ CURRENT',
                      '           ├─ 1.8 behavior metadata          ✅\n           └─ 1.9 static manifest inspection  ▶ CURRENT',
                  ),
                  ('**1.8 current**', '**1.9 current**'),
                  (
                      'A node manifest is inspectable without executing plugin code and carries versioned identity plus input/config/output schemas. Behavior, capabilities, effect/recovery metadata, timeout/retry defaults, and execution mode are layered on next.',
                      'A node manifest carries versioned identity, input/config/output schemas, primitive family, determinism, effect/idempotency and recovery policy, timeout/retry defaults, execution mode, and required capabilities. The next step proves this static manifest can be inspected without executing node implementation code.',
                  ),
                  (
                      '> **Phase 1 / Item 1.8 — Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.**',
                      '> **Phase 1 / Item 1.9 — Ensure manifests can be inspected without executing plugin node code.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): complete behavior metadata milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
