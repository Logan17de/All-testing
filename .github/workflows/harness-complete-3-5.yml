name: Harness complete 3.5 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-3-5.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 3.5 and advance 3.6
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 3.5 Add router branch activation.",
                      "- [x] 3.5 Add router branch activation.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "3.5 router branch activation             ▶ CURRENT",
                      "3.5 router branch activation             ✅\n3.6 control-edge runtime states           ▶ CURRENT",
                  ),
                  (
                      "Item 3.4 adds the first one-shot in-memory execution loop as `PlainDagRun`. It supports only the ordinary executable DAG subset: structured-control descriptors and `executionMode: none` are rejected rather than accidentally treated as normal fan-out. FIFO-ready reservations acquire the 3.3 run/global permit before `ready → running`; successful execution transitions to `completed`, then releases every ordinary predecessor pair so newly-unblocked work enters the readiness queue. Independent ready branches are dispatched concurrently up to the compiled per-run/global ceilings, while fan-in remains blocked until every predecessor completes. Ready reservations are tracked explicitly so an op cannot be double-dispatched. Executor failure marks only the active op `failed`, releases no downstream dependency, stops new dispatch, lets already-admitted peers settle, and rejects with the original error; downstream failure propagation remains later coverage. The executor callback is adapter-neutral and returns no runtime values yet, preserving later model/tool/value-materialization ownership. Router activation begins in 3.5; control-edge states, joins, cancellation, timeout, retry, events, and persistence remain later items.",
                      "Item 3.4 adds the first one-shot in-memory execution loop as `PlainDagRun`. It supports only the ordinary executable DAG subset: structured-control descriptors and `executionMode: none` are rejected rather than accidentally treated as normal fan-out. FIFO-ready reservations acquire the 3.3 run/global permit before `ready → running`; successful execution transitions to `completed`, then releases every ordinary predecessor pair so newly-unblocked work enters the readiness queue. Independent ready branches are dispatched concurrently up to the compiled per-run/global ceilings, while fan-in remains blocked until every predecessor completes. Ready reservations are tracked explicitly so an op cannot be double-dispatched. Executor failure marks only the active op `failed`, releases no downstream dependency, stops new dispatch, lets already-admitted peers settle, and rejects with the original error; downstream failure propagation remains later coverage. The executor callback is adapter-neutral and returns no runtime values yet, preserving later model/tool/value-materialization ownership. Router activation begins in 3.5; control-edge states, joins, cancellation, timeout, retry, events, and persistence remain later items.\n\nItem 3.5 adds run-local router selection as `RunRouterActivation` without prematurely introducing control-edge state. A scheduler-owned router must be a dequeued ready reservation with `executionMode: none`; selecting one declared branch transitions the router `ready → running → completed` without consuming an executor/concurrency permit, then releases only the deduplicated router→target dependency pairs wired from that selected output port. Unselected branches are not released and therefore stay blocked until 3.6 can represent explicit skipped edge outcomes. One selected branch is recorded per router in deterministic frozen snapshots. Undeclared branches, repeat selection, non-router activation, malformed/unported router wiring, and missing IR dependency links fail before dependency counters can be corrupted. Branch choice itself is supplied by the caller/runtime adapter; scheduler code does not inspect node values or invent routing policy. 3.6 now owns `unresolved/active/skipped/completed` control-edge runtime state.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           ├─ 3.1 op status state machine                              ✅\n           ├─ 3.2 readiness queue + dependency counters                ✅\n           ├─ 3.3 bounded global/per-run concurrency                   ✅\n           ├─ 3.4 concurrent DAG branches                              ✅\n           └─ 3.5 router branch activation                             ▶ CURRENT",
                      "Phase 3  In-memory DAG scheduler           🚧 WE ARE HERE\n           ├─ 3.1 op status state machine                              ✅\n           ├─ 3.2 readiness queue + dependency counters                ✅\n           ├─ 3.3 bounded global/per-run concurrency                   ✅\n           ├─ 3.4 concurrent DAG branches                              ✅\n           ├─ 3.5 router branch activation                             ✅\n           └─ 3.6 control-edge runtime states                          ▶ CURRENT",
                  ),
                  (
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.5 current** |",
                      "| **3 — In-memory DAG Scheduler** | readiness queue, bounded concurrency, routers, activation-aware joins, cancellation, timeout, retry, runtime events | 🚧 In progress — **3.6 current** |",
                  ),
                  (
                      "> **Phase 3 / Item 3.5 — Add router branch activation.**",
                      "> **Phase 3 / Item 3.6 — Add control-edge runtime states: unresolved/active/skipped/completed.**",
                  ),
              ],
              "harness/RUNTIME.md": [
                  (
                      "Item 3.4 composes readiness and concurrency into `PlainDagRun`, the first actual framework-free executor loop. Dequeue creates an explicit ready reservation; after run/global admission succeeds that exact reservation becomes `running`, and successful completion releases all ordinary dependent pairs. Newly-zero dependency counters append work to the FIFO queue, so fan-out branches can overlap while fan-in waits for all predecessors. Dispatch never exceeds the compiled run ceiling or scheduler-global ceiling. The 3.4 runner intentionally rejects structured-control descriptors and `executionMode: none`; routers are not treated as ordinary completion fan-out. Executor errors mark the active op failed, satisfy no downstream dependency, stop new dispatch, allow already-admitted peers to settle, and reject the one-shot run. Failure propagation, value materialization, retries, cancellation, timeout, events, and persistence are not claimed here. Router branch activation begins in 3.5.",
                      "Item 3.4 composes readiness and concurrency into `PlainDagRun`, the first actual framework-free executor loop. Dequeue creates an explicit ready reservation; after run/global admission succeeds that exact reservation becomes `running`, and successful completion releases all ordinary dependent pairs. Newly-zero dependency counters append work to the FIFO queue, so fan-out branches can overlap while fan-in waits for all predecessors. Dispatch never exceeds the compiled run ceiling or scheduler-global ceiling. The 3.4 runner intentionally rejects structured-control descriptors and `executionMode: none`; routers are not treated as ordinary completion fan-out. Executor errors mark the active op failed, satisfy no downstream dependency, stop new dispatch, allow already-admitted peers to settle, and reject the one-shot run. Failure propagation, value materialization, retries, cancellation, timeout, events, and persistence are not claimed here. Router branch activation begins in 3.5.\n\nItem 3.5 introduces `RunRouterActivation` as a narrow structured-control primitive over immutable Execution IR plus one run's readiness counters. A router must be scheduler-owned (`executionMode: none`) and hold an explicit dequeued ready reservation. The caller selects exactly one declared branch; the router follows `ready → running → completed` without consuming a node executor or semaphore permit, and only control edges sourced from the selected router output port release their router→target dependency pairs. Multiple targets on one selected branch are supported and duplicate target edges are collapsed so a dependency releases once. Other dependencies on a selected target remain respected. Unselected branches intentionally remain unresolved/blocked because 3.5 does not invent edge state or skip propagation. Selection is recorded once per router in deterministic frozen snapshots. Invalid branches, repeat selection, non-router activation, malformed router output wiring, and compiler-invariant missing dependency links are rejected before release. 3.6 owns explicit `unresolved/active/skipped/completed` control-edge runtime states; joins remain 3.7.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md RUNTIME.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-3-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/RUNTIME.md .github/workflows/harness-complete-3-5.yml
          git commit -m "docs(harness): freeze 3.5 and advance 3.6"
          git push origin HEAD:zet-harness-v1
