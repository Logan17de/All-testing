name: Harness format 2.7

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-2-7.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Format 2.7 files
        working-directory: harness
        run: >-
          npx prettier --write
          packages/graph/src/graph-json-v1-semantic-validator.ts
          packages/graph/src/graph-json-v1-semantic-validator.test.ts

      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harness-format-2-7.yml
          git add harness/packages/graph/src/graph-json-v1-semantic-validator.ts harness/packages/graph/src/graph-json-v1-semantic-validator.test.ts
          git commit -m "style(harness): format 2.7 validator"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
