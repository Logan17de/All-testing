name: Harness complete 2.3 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-3.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Complete 2.2 and 2.3
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 2.2 Define Graph JSON v1: graph metadata, nodes, ports/bindings, edges, policies, options, editor-only metadata.',
                      '- [x] 2.2 Define Graph JSON v1: graph metadata, nodes, ports/bindings, edges, policies, options, editor-only metadata.',
                  ),
                  (
                      '- [ ] 2.3 Choose JSON Schema Draft 2020-12 as the public shape-validation format.',
                      '- [x] 2.3 Choose JSON Schema Draft 2020-12 as the public shape-validation format.',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 2.2 Graph JSON v1                  ▶ CURRENT (design review)',
                      '           ├─ 2.2 Graph JSON v1                  ✅\n           ├─ 2.3 JSON Schema Draft 2020-12         ✅\n           └─ 2.4 Ajv boundary decision              ▶ CURRENT',
                  ),
                  (
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.2 design review** |',
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.4 current** |',
                  ),
                  (
                      '> **Phase 2 / Item 2.2 — Freeze the reviewed Graph JSON v1 semantics: first-class ports, hash domains, capability requests, and data/control edge meaning.**',
                      '> **Phase 2 / Item 2.4 — Decide whether Ajv materially simplifies Draft 2020-12 boundary validation; keep validation out of scheduler logic.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")

          graph_path = Path("harness/GRAPH.md")
          graph = graph_path.read_text(encoding="utf-8")
          marker = "## Graph JSON v1\n"
          section = '''## Public JSON Schema dialect\n\nZet Harness v1 uses **JSON Schema Draft 2020-12** for every public schema surface. The public plugin API exports the canonical dialect URI:\n\n```ts\nJSON_SCHEMA_DIALECT_URI = "https://json-schema.org/draft/2020-12/schema"\n```\n\nThis single dialect applies to:\n\n- node input-port schemas;\n- node output-port schemas;\n- node config schemas;\n- graph public input schemas;\n- graph public output schemas.\n\nV1 does not negotiate or mix schema dialects per plugin, node, port, or graph field. JSON Schema is used for **shape/value validation**. Port-to-port compatibility remains a separate Harness compiler rule with a deliberately small, deterministic compatibility model; the compiler must not attempt arbitrary JSON-Schema implication/theorem proving.\n\nValidator implementation is an internal graph-package choice and must never leak into scheduler/runtime semantics.\n\n'''
          if marker not in graph:
              raise SystemExit("Graph JSON marker not found")
          if "## Public JSON Schema dialect" not in graph:
              graph = graph.replace(marker, section + marker, 1)
              graph_path.write_text(graph, encoding="utf-8", newline="\n")
      - name: Commit tracker and architecture changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md harness/GRAPH.md
          git commit -m "docs(harness): complete JSON Schema dialect milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
