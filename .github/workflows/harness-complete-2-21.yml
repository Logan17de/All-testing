name: Harness complete 2.21 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-21.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.21 and advance 2.22
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.21 Record document hash, semantic hash, IR hash, compiler version, registry hash, and pinned node versions.",
                      "- [x] 2.21 Record document hash, semantic hash, IR hash, compiler version, registry hash, and pinned node versions.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.21 hashes/compiler identity         ▶ CURRENT\n2.22+ IR lowering/tests               ⏳",
                      "2.21 hashes/compiler identity         ✅\n2.22 DAG/router/join lowering         ▶ CURRENT\n2.23+ compiler tests                  ⏳",
                  ),
                  (
                      "`createExecutionIrV1` structured-clones and deeply freezes an internal compiler-produced candidate, so bad indexes are compiler invariant failures rather than new user-facing Graph diagnostics. 2.20 defines no Graph-to-IR lowering; 2.22 owns DAG/router/join lowering. Hash/compiler/registry identity remains 2.21.",
                      "`createExecutionIrV1` structured-clones and deeply freezes an internal compiler-produced candidate, so bad indexes are compiler invariant failures rather than new user-facing Graph diagnostics. 2.20 defines no Graph-to-IR lowering; 2.22 owns DAG/router/join lowering. 2.21 now records the independent compiler identity domains using domain-separated SHA-256 through Web Crypto: `documentHash` covers the complete 2.17 normalized authoring document including document/human/editor identity while canonical JSON removes object-key serialization noise; `semanticHash` hashes only 2.19 `canonicalSemanticsJson`; `registryHash` hashes the canonical resolved node/plugin pin snapshot; and `irHash` hashes only the 2.20 Execution IR content. The explicit compiler identity is `harness.compiler/v1`, recorded separately so the frozen compile formula remains `semanticHash + registryHash + compilerVersion → deterministic compile → canonical IR → irHash`. The identity record also carries immutable exact node/plugin pins. No fixed digest golden vectors are frozen yet; 2.23 owns stable canonical hash tests. 2.22 remains the Graph-to-IR lowering step.",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.21 hashes/compiler identity                         ▶ CURRENT",
                      "           ├─ 2.21 hashes/compiler identity                         ✅\n           └─ 2.22 DAG/router/join lowering                         ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.21 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.22 current** |",
                  ),
                  (
                      "No Graph-to-IR lowering happens here: 2.22 owns DAG dependencies plus router/join lowering, while document/semantic/registry/IR hashes and compiler identity remain 2.21.",
                      "No Graph-to-IR lowering happens here: 2.22 owns DAG dependencies plus router/join lowering. 2.21 records the compiler provenance/content identities with domain-separated SHA-256: exact normalized authoring document, canonical executable semantics, resolved node/plugin registry pins, and Execution IR each have independent hashes; compiler version is explicitly `harness.compiler/v1`; exact node/plugin pins are carried beside the hashes; and the implementation uses Web Crypto rather than adding a Node-only crypto import. Compiler version is not folded into the content hashes, preserving `semanticHash + registryHash + compilerVersion` as the deterministic compile identity. Fixed digest golden vectors remain 2.23.",
                  ),
                  (
                      "> **Phase 2 / Item 2.21 — Record document hash, semantic hash, IR hash, compiler version, registry hash, and pinned node versions.**",
                      "> **Phase 2 / Item 2.22 — Lower basic DAG dependencies, routers, and join descriptors into the IR.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "The canonical IR then receives its **own content hash** (`irHash`). This keeps the IR hash about IR content while still recording the semantic source, registry, and compiler provenance separately.\n\nActual canonicalization/hash computation lands later in Phase 2; this section freezes which fields belong to each domain now.",
                      "The canonical IR then receives its **own content hash** (`irHash`). This keeps the IR hash about IR content while still recording the semantic source, registry, and compiler provenance separately.\n\n2.21 implements these identities with `recordGraphCompilerIdentityV1`. All content hashes use SHA-256 with explicit Harness v1 domain separation and are serialized as `sha256:<64 lowercase hex digits>`. Hashing uses Web Crypto (`crypto.subtle`) so the graph package does not gain a Node-only crypto import. The compiler behavior identity is the explicit constant `harness.compiler/v1`; it is recorded separately and must be bumped when deterministic lowering semantics change.\n\n`documentHash` hashes the complete 2.17 normalized authoring document. It therefore includes `graphId`, `revisionId`, human metadata, editor state, semantic source, and normalized Harness-owned defaults. Object-key insertion order is removed by `stringifyCanonicalJsonV1`, while authoring/source arrays remain ordered so the document hash continues to identify the exact normalized saved document. `semanticHash` hashes only the 2.19 `canonicalSemanticsJson`, so graph/revision/human/editor-only changes cannot alter executable semantic identity.\n\n`registryHash` hashes the canonical resolved registry slice used by compilation: sorted per-node pins (`nodeId`, node `type@version`, owning plugin id/version) plus deduplicated/sorted plugin pins. A plugin resolution/version change can therefore alter registry identity without altering the graph's semantic source. The immutable identity record also carries those exact node/plugin pins directly for provenance. `irHash` hashes only serialized `ExecutionIrV1` content, so it remains a pure content identity rather than a compound provenance key.\n\nThe frozen relationship is therefore unchanged:\n\n```text\nsemanticHash + registryHash + compilerVersion\n                    ↓\n            deterministic compile\n                    ↓\n              canonical IR\n                    ↓\n                 irHash\n```\n\n2.21 does not lower Graph JSON into IR and does not define hard-coded digest golden vectors. 2.22 owns DAG/router/join lowering; 2.23 owns stable canonical hash vectors/tests.",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-21.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-21.yml
          git commit -m "docs(harness): freeze 2.21 and advance 2.22"
          git push origin HEAD:zet-harness-v1
