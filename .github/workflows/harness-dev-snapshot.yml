name: Harness development snapshot
on:
  push:
    branches: [zet-harness-runtime-dispatch]
    paths: [.github/workflows/harness-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: harness
      - name: Archive supplementary development tools only
        shell: bash
        run: |
          mkdir -p /tmp/harness-extras
          find harness/apps harness/packages -type d -name node_modules -prune -print0 | tar --null -T - -cf /tmp/harness-tools.tar
          tar -xf /tmp/harness-tools.tar -C /tmp/harness-extras
          cp -a "$(npm root -g)/npm" /tmp/harness-extras/npm
          tar -czf /tmp/harness-extras.tgz -C /tmp/harness-extras .
      - uses: actions/upload-artifact@v4
        with:
          name: harness-extras
          path: /tmp/harness-extras.tgz
          retention-days: 1
          compression-level: 0
