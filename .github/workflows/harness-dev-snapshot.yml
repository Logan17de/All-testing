name: Harness development snapshot
on:
  push:
    branches: [zet-harness-runtime-dispatch]
    paths: [.github/workflows/harness-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install --global npm@12.0.2 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: harness
      - name: Archive tracked source and development tools only
        shell: bash
        run: |
          mkdir -p /tmp/harness-snapshot
          git archive HEAD harness .github/workflows | tar -x -C /tmp/harness-snapshot
          cp "$(command -v node)" /tmp/harness-snapshot/node
          tar -cf /tmp/harness-tools.tar --exclude='harness/node_modules/next' --exclude='harness/node_modules/@next/swc-*' --exclude='harness/node_modules/@img' harness/node_modules
          tar -xf /tmp/harness-tools.tar -C /tmp/harness-snapshot
          git rev-parse HEAD > /tmp/harness-snapshot/SOURCE_COMMIT
          tar -czf /tmp/harness-development.tgz -C /tmp/harness-snapshot .
      - uses: actions/upload-artifact@v4
        with:
          name: harness-development
          path: /tmp/harness-development.tgz
          retention-days: 1
          compression-level: 0
