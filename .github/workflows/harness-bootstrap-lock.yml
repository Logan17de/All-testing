name: Harness bootstrap lockfile

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Generate lockfile
        working-directory: harness
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: npm install --package-lock-only --ignore-scripts --prefer-online

      - name: Commit lockfile
        run: |
          if git diff --quiet -- harness/package-lock.json && git ls-files --error-unmatch harness/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/package-lock.json
          git commit -m "chore(harness): commit npm lockfile"
          git push origin HEAD:zet-harness-v1
