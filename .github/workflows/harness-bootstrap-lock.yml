name: Harness bootstrap lockfile

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-bootstrap-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.20.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Generate lockfile
        working-directory: harness
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: npm install --package-lock-only --ignore-scripts --prefer-online

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: harness-package-lock
          path: harness/package-lock.json
          if-no-files-found: error
