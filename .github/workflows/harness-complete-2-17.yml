name: Harness complete 2.17 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-17.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Install workspace
        working-directory: harness
        run: npm ci --no-audit --no-fund

      - name: Freeze 2.17 and advance 2.18
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "harness/TODO.md": [
                  (
                      "- [ ] 2.17 Normalize defaults and pin resolved node/plugin versions.",
                      "- [x] 2.17 Normalize defaults and pin resolved node/plugin versions.",
                  ),
              ],
              "harness/README.md": [
                  (
                      "2.17 normalization/version pins       ▶ CURRENT\n2.18+ compiler/IR                     ⏳",
                      "2.17 normalization/version pins       ✅\n2.18 UI metadata stripping            ▶ CURRENT\n2.19+ compiler/IR                     ⏳",
                  ),
                  (
                      "and shape/semantic prerequisite failures short-circuit derivative stages to avoid diagnostic cascades.\n\nValidation ownership is permanently separated:",
                      "and shape/semantic prerequisite failures short-circuit derivative stages to avoid diagnostic cascades. 2.17 begins source normalization after validation: `normalizeGraphJsonV1` materializes only closed Harness-owned defaults, records exact per-node node/plugin version pins plus deduplicated plugin pins, and requires plugin provenance supplied by the host registry. `PluginHost` attaches plugin id/version to `NodeCatalog` registrations internally without changing the public plugin registration API. JSON Schema `default` annotations are not applied to node config, source order is preserved for 2.19 canonicalization, and editor metadata remains present until 2.18. Normalization diagnostics extend the 2.16 contract with `stage: \"normalization\"`. No digest, hash, UI stripping, canonical ordering, or IR lowering is performed here.\n\nValidation ownership is permanently separated:",
                  ),
              ],
              "harness/PLAN.md": [
                  (
                      "           └─ 2.17 normalization/version pins                 ▶ CURRENT",
                      "           ├─ 2.17 normalization/version pins                 ✅\n           └─ 2.18 UI metadata stripping                      ▶ CURRENT",
                  ),
                  (
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.17 current** |",
                      "| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.18 current** |",
                  ),
                  (
                      "A loop bound greater than graph `maxNodeExecutions` is rejected as a statically known policy contradiction.\n\nDeterministic acceptance property:",
                      "A loop bound greater than graph `maxNodeExecutions` is rejected as a statically known policy contradiction.\n\nSource normalization begins only after those validation stages succeed. 2.17 materializes the closed Graph JSON v1 defaults (`required: false`, empty bindings/capability buckets/options), verifies exact resolved node identity, and records the active plugin id/version that registered each node. Plugin provenance is host registry metadata, not authority authored into Graph JSON. JSON Schema `default` annotations do not mutate executable config. 2.17 does not strip editor metadata or reorder source collections; those remain 2.18 and 2.19 respectively. Hashes, digests, registry identity, and IR lowering remain later compiler items.\n\nDeterministic acceptance property:",
                  ),
                  (
                      "> **Phase 2 / Item 2.17 — Normalize defaults and pin resolved node/plugin versions.**",
                      "> **Phase 2 / Item 2.18 — Strip UI-only metadata during compilation.**",
                  ),
              ],
              "harness/GRAPH.md": [
                  (
                      "Ajv error objects are not part of any public contract. Replacing Ajv later must not require changing Graph JSON, plugin manifests, compiler semantics, scheduler behavior, runtime records, or the Harness diagnostic contract.\n\n## Graph JSON v1",
                      "Ajv error objects are not part of any public contract. Replacing Ajv later must not require changing Graph JSON, plugin manifests, compiler semantics, scheduler behavior, runtime records, or the Harness diagnostic contract.\n\n### Graph JSON v1 normalization and resolved version pins\n\n2.17 is the first source-normalization stage and runs only after the frozen validation stack succeeds. `normalizeGraphJsonV1(graph, resolver)` is pure: it returns a new normalized document plus resolved pins and does not mutate the editable Graph JSON. The registry-neutral `NodeResolutionResolver` extends exact manifest lookup with the active plugin provenance for that node registration. `PluginHost` supplies `{ pluginId, pluginVersion }` to `NodeCatalog` internally when a plugin registers a node; the public plugin registration API remains unchanged and `packages/graph` does not depend on `packages/core`. Direct low-level catalog registrations without plugin provenance may still be inspected, but cannot satisfy compiler normalization/pinning.\n\nThe closed v1 defaults materialized here are intentionally small: omitted graph-input `required` becomes `false`, omitted node `bindings` becomes `[]`, omitted graph capability buckets become empty arrays, and omitted `policies`/`options` become explicit normalized containers. Explicit source values are preserved. JSON Schema `default` remains an annotation and is not applied to node config; executable config defaults would require a separate explicit Harness contract rather than silently redefining JSON Schema behavior.\n\nEach normalized node records `nodeId`, exact `type`, exact node `version`, owning `pluginId`, and exact `pluginVersion`. A deduplicated plugin-pin list is also produced. Resolution must match the source `type@version`; plugin id/version must be non-empty; and one normalized graph cannot resolve two versions of the same active plugin id. Normalization failures use the common 2.16 diagnostic vocabulary with `stage: \"normalization\"` and JSON Pointer node paths.\n\n2.17 deliberately preserves graph/editor metadata and source collection order. 2.18 owns removal of UI-only editor state, while 2.19 owns deterministic canonical ordering/serialization. This stage does not compute package digests, registry/compiler hashes, semantic/document hashes, or Execution IR; those remain later compiler items.\n\n## Graph JSON v1",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"missing expected text in {filename}: {old[:180]}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Format tracker docs
        working-directory: harness
        run: npx prettier --write TODO.md README.md PLAN.md GRAPH.md

      - name: Commit tracker freeze and remove helper
        run: |
          rm .github/workflows/harness-complete-2-17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/README.md harness/PLAN.md harness/GRAPH.md .github/workflows/harness-complete-2-17.yml
          git commit -m "docs(harness): freeze 2.17 and advance 2.18"
          git push origin HEAD:zet-harness-v1
