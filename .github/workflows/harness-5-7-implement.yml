name: Harness 5.7 Implementation

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-5-7-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - name: Apply 5.7
        run: node .github/scripts/harness-5-7-implement.mjs
      - name: Tighten test literal typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('harness/packages/scheduler/src/invocation-capability-policy.test.ts')
          text = path.read_text()
          pattern = re.compile(r'''    const evaluate = vi\.fn\(\(capability: string\) => \(\{\n\s+decision: capability === "fs:read" \|\| capability === "network:http" \? "allow" : "deny",\n\s+\}\)\) satisfies PlainDagCapabilityAuthority\["evaluate"\];''')
          replacement = '''    const evaluateImpl: PlainDagCapabilityAuthority["evaluate"] = (capability) => ({
              decision: capability === "fs:read" || capability === "network:http" ? "allow" : "deny",
            });
            const evaluate = vi.fn(evaluateImpl);'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'contextual typing anchor mismatch: {count}')
          path.write_text(text)
          PY
      - name: Format changed files
        working-directory: harness
        run: npx prettier --write packages/scheduler/src/plain-dag-run.ts packages/scheduler/src/index.ts packages/scheduler/src/invocation-capability-policy.test.ts scripts/capability-invocation-enforcement.test.ts
      - name: Typecheck
        working-directory: harness
        run: npm run typecheck
      - name: Lint
        working-directory: harness
        run: npm run lint
      - name: Tests
        working-directory: harness
        run: npm test
      - name: Commit and remove helper
        shell: bash
        run: |
          rm .github/workflows/harness-5-7-implement.yml .github/scripts/harness-5-7-implement.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/scheduler/src/plain-dag-run.ts harness/packages/scheduler/src/index.ts harness/packages/scheduler/src/invocation-capability-policy.test.ts harness/scripts/capability-invocation-enforcement.test.ts .github/workflows/harness-5-7-implement.yml .github/scripts/harness-5-7-implement.mjs
          git commit -m "feat(scheduler): recheck capabilities at invocation"
          git push origin HEAD:zet-harness-v1
