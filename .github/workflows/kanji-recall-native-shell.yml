name: Build Kanji Recall native shell

on:
  push:
    branches:
      - kanji-recall-native-export-v32

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Android shell to DEX
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          ANDROID_JAR=$(find "$SDK/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          D8=$(find "$SDK/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)
          echo "android.jar=$ANDROID_JAR"
          echo "d8=$D8"
          mkdir -p out/classes out/dex
          javac -source 8 -target 8 -cp "$ANDROID_JAR" -d out/classes tools/kanji-recall-shell/MainActivity.java
          "$D8" --min-api 23 --lib "$ANDROID_JAR" --output out/dex $(find out/classes -type f -name '*.class' -print)
          test -s out/dex/classes.dex
          sha256sum out/dex/classes.dex

      - uses: actions/upload-artifact@v4
        with:
          name: kanji-recall-native-shell
          path: out/dex/classes.dex
          if-no-files-found: error
