name: Harness enter Phase 2

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-enter-phase-2.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance Phase 1 to Phase 2
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  ('- [ ] 1.12 Add plugin smoke to CI.', '- [x] 1.12 Add plugin smoke to CI.'),
                  ('**1.12 — Add plugin smoke to CI.**', '**2.1 — Create a lightweight `packages/graph` workspace for Graph source, compiler, and IR modules.**'),
              ],
              Path("harness/PLAN.md"): [
                  ('Phase 1  Plugin API + universal node      🚧 WE ARE HERE', 'Phase 1  Plugin API + universal node      ✅ COMPLETE'),
                  ('           └─ 1.12 plugin smoke in CI          ▶ CURRENT', '           └─ 1.12 plugin smoke in CI          ✅'),
                  ('Phase 2  Graph JSON + compiler + IR        ⏳', 'Phase 2  Graph JSON + compiler + IR        🚧 WE ARE HERE\n           └─ 2.1 graph workspace               ▶ CURRENT'),
                  ('| **1 — Plugin API + universal node contract** | freeze the tiny public extension boundary, plugin lifecycle, registry, node manifests, built-in/external plugin parity | 🚧 In progress — **1.12 current** |', '| **1 — Plugin API + universal node contract** | freeze the tiny public extension boundary, plugin lifecycle, registry, node manifests, built-in/external plugin parity | ✅ Complete |'),
                  ('| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | ⏳ Next architecture layer |', '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.1 current** |'),
                  ('The next step adds a focused plugin smoke gate to CI.', 'A focused plugin smoke gate now runs explicitly in Linux and Windows CI. Phase 1 is complete; Phase 2 begins with the lightweight graph workspace before Graph JSON semantics are frozen.'),
                  ('> **Phase 1 / Item 1.12 — Add plugin smoke to CI.**', '> **Phase 2 / Item 2.1 — Create a lightweight `packages/graph` workspace for Graph source, compiler, and IR modules.**'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): enter phase 2"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
