name: Harness format Graph JSON v1

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-graph-json.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund
      - name: Install
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - name: Format Graph JSON v1
        working-directory: harness
        run: npx prettier --write packages/graph/src/graph-json-v1.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/packages/graph/src/graph-json-v1.ts
          git commit -m "style(harness): format Graph JSON v1 contract"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
