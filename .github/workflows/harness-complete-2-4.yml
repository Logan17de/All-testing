name: Harness complete 2.4 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-complete-2-4.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Complete 2.4 and advance to 2.5
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 2.4 Add Ajv only if its compiled validation materially simplifies the boundary; keep it out of runtime scheduling logic.',
                      '- [x] 2.4 Add Ajv only if its compiled validation materially simplifies the boundary; keep it out of runtime scheduling logic.',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 2.4 Ajv boundary decision              ▶ CURRENT',
                      '           ├─ 2.4 Ajv boundary decision              ✅\n           └─ 2.5 shape/schema validation             ▶ CURRENT',
                  ),
                  (
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.4 current** |',
                      '| **2 — Graph JSON + Compiler + Execution IR** | define portable graph source, semantic validation, deterministic compilation, canonical hashes, compact immutable IR | 🚧 In progress — **2.5 current** |',
                  ),
                  (
                      '> **Phase 2 / Item 2.4 — Decide whether Ajv materially simplifies Draft 2020-12 boundary validation; keep validation out of scheduler logic.**',
                      '> **Phase 2 / Item 2.5 — Add Graph JSON v1 shape/schema validation through the isolated Draft 2020-12 boundary.**',
                  ),
              ],
              Path("harness/README.md"): [
                  (
                      '2.4 Ajv boundary decision       ▶ CURRENT\n2.5+ validation/compiler/IR     ⏳',
                      '2.4 Ajv boundary decision       ✅\n2.5 shape/schema validation     ▶ CURRENT\n2.6+ semantic/compiler/IR       ⏳',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md harness/README.md
          git commit -m "docs(harness): complete Ajv boundary decision"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
