name: Harness 5.5 Roadmap Handoff

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-5-5-roadmap.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Patch roadmap
        run: node .github/scripts/harness-5-5-roadmap.mjs
      - name: Commit roadmap handoff
        run: |
          rm .github/workflows/harness-5-5-roadmap.yml
          rm .github/scripts/harness-5-5-roadmap.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md .github/workflows/harness-5-5-roadmap.yml .github/scripts/harness-5-5-roadmap.mjs
          git commit -m "docs: complete Harness 5.5 capability policy"
          git push origin HEAD:zet-harness-v1
