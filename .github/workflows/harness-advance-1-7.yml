name: Harness advance 1.7 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-advance-1-7.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance TODO and PLAN
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 1.7 Include node input/config/output schemas in the manifest.',
                      '- [x] 1.7 Include node input/config/output schemas in the manifest.',
                  ),
                  (
                      '**1.7 — Include node input/config/output schemas in the manifest.**',
                      '**1.8 — Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.**',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 1.7 node schemas              ▶ CURRENT',
                      '           ├─ 1.7 node schemas              ✅\n           └─ 1.8 behavior metadata          ▶ CURRENT',
                  ),
                  ('**1.7 current**', '**1.8 current**'),
                  (
                      'A node manifest must be inspectable without executing plugin code and eventually carries schemas, versions, capabilities, effect/recovery metadata, timeout/retry defaults, and execution mode.',
                      'A node manifest is inspectable without executing plugin code and carries versioned identity plus input/config/output schemas. Behavior, capabilities, effect/recovery metadata, timeout/retry defaults, and execution mode are layered on next.',
                  ),
                  (
                      '> **Phase 1 / Item 1.7 — Include node input/config/output schemas in the manifest.**',
                      '> **Phase 1 / Item 1.8 — Include node behavior metadata: primitive family, determinism, effect/idempotency, recovery, timeout/retry defaults, execution mode, required capabilities.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): complete node schema milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
