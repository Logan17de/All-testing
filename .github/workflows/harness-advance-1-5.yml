name: Harness advance 1.5 tracker

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-advance-1-5.yml"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance TODO and PLAN
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("harness/TODO.md"): [
                  (
                      '- [ ] 1.5 Add a generic typed registry primitive used by plugin-provided capabilities.',
                      '- [x] 1.5 Add a generic typed registry primitive used by plugin-provided capabilities.',
                  ),
                  (
                      '**1.5 — Add a generic typed registry primitive used by plugin-provided capabilities.**',
                      '**1.6 — Freeze the universal `NodeDefinition`/`NodeManifest` contract.**',
                  ),
              ],
              Path("harness/PLAN.md"): [
                  (
                      '           └─ 1.5 typed registry            ▶ CURRENT',
                      '           ├─ 1.5 typed registry            ✅\n           └─ 1.6 node contract             ▶ CURRENT',
                  ),
                  ('**1.5 current**', '**1.6 current**'),
                  (
                      '> **Phase 1 / Item 1.5 — Add a generic typed registry primitive used by plugin-provided capabilities.**',
                      '> **Phase 1 / Item 1.6 — Freeze the universal `NodeDefinition`/`NodeManifest` contract.**',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit tracker changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs(harness): complete typed registry milestone"
          git pull --rebase origin zet-harness-v1
          git push origin HEAD:zet-harness-v1
