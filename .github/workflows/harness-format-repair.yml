name: Harness Format Repair

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-repair.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: harness

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0

      - name: Pin npm
        run: npm install --global npm@12.0.2 --no-audit --no-fund

      - name: Clean install
        run: npm ci --no-audit --no-fund

      - name: Format target files
        run: npx prettier --write packages/scheduler/src/plain-dag-run.ts packages/scheduler/src/effect-aware-retry.test.ts

      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- packages/scheduler/src/plain-dag-run.ts packages/scheduler/src/effect-aware-retry.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/scheduler/src/plain-dag-run.ts packages/scheduler/src/effect-aware-retry.test.ts
          git commit -m "style(scheduler): format effect-aware retry changes"
          git push
