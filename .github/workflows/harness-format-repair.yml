name: Harness 5.3 Roadmap Cleanup

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-format-repair.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark 5.3 complete and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path("harness/TODO.md")
          todo = todo_path.read_text()
          old = "- [ ] 5.3 Add effect-aware retry rules; never infer that an uncertain external write is safe to repeat."
          new = "- [x] 5.3 Add effect-aware retry rules; never infer that an uncertain external write is safe to repeat."
          assert todo.count(old) == 1
          todo_path.write_text(todo.replace(old, new))

          plan_path = Path("harness/PLAN.md")
          plan = plan_path.read_text()

          old_status = """Phase 5  Effects + permissions + humans    🚧 WE ARE HERE
                     ├─ 5.1 effect/idempotency/recovery invariants                       ✅
                     ├─ 5.2 stable logical effect/idempotency identity                   ✅
                     └─ 5.3 effect-aware retry rules                                     ▶ CURRENT"""
          new_status = """Phase 5  Effects + permissions + humans    🚧 WE ARE HERE
                     ├─ 5.1 effect/idempotency/recovery invariants                       ✅
                     ├─ 5.2 stable logical effect/idempotency identity                   ✅
                     ├─ 5.3 effect-aware retry rules                                     ✅
                     └─ 5.4 reconciliation/manual-review outcomes                        ▶ CURRENT"""
          assert plan.count(old_status) == 1
          plan = plan.replace(old_status, new_status)

          old_map = "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | 🚧 In progress — **5.3 current** |"
          new_map = "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | 🚧 In progress — **5.4 current** |"
          assert plan.count(old_map) == 1
          plan = plan.replace(old_map, new_map)

          anchor = "Effect-aware retry permission remains 5.3 rather than being inferred from the existence of this stable ID."
          addition = """Effect-aware retry permission remains 5.3 rather than being inferred from the existence of this stable ID.

          Phase 5.3 adds scheduler-level effect-aware repeat authorization without expanding schema or graph validation. Side-effect-free work, external reads, and explicitly idempotent writes may consume the existing shared retry budget. `external-write` operations with unknown idempotency are never repeated, even if hand-crafted IR carries a larger retry budget. `idempotency-key` writes require an explicit runtime assertion that a stable Harness-owned key is bound to the integration operation; the persisted logical effect ID alone is not treated as retry authority. The same authorization clamps adapter/executor-internal retries through the shared `PlainDagRetryBudget`, so an internal retry layer cannot bypass effect safety. Authorization for key-backed writes is cached per logical op to prevent policy drift between scheduler attempts."""
          assert plan.count(anchor) == 1
          plan = plan.replace(anchor, addition)
          plan_path.write_text(plan)
          PY

          git rm .github/workflows/harness-format-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs: complete Harness 5.3 effect-aware retries"
          git push
