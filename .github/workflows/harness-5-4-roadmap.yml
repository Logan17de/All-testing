name: Harness 5.4 Roadmap Handoff

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - ".github/workflows/harness-5-4-roadmap.yml"

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Complete 5.4 and advance 5.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path("harness/TODO.md")
          todo = todo_path.read_text()
          old_todo = "- [ ] 5.4 Add reconciliation/manual-review outcomes for ambiguous external writes."
          new_todo = "- [x] 5.4 Add reconciliation/manual-review outcomes for ambiguous external writes."
          assert todo.count(old_todo) == 1
          todo_path.write_text(todo.replace(old_todo, new_todo))

          plan_path = Path("harness/PLAN.md")
          plan = plan_path.read_text()

          old_status = """Phase 5  Effects + permissions + humans    🚧 WE ARE HERE
                     ├─ 5.1 effect/idempotency/recovery invariants                       ✅
                     ├─ 5.2 stable logical effect/idempotency identity                   ✅
                     ├─ 5.3 effect-aware retry rules                                     ✅
                     └─ 5.4 reconciliation/manual-review outcomes                        ▶ CURRENT"""
          new_status = """Phase 5  Effects + permissions + humans    🚧 WE ARE HERE
                     ├─ 5.1 effect/idempotency/recovery invariants                       ✅
                     ├─ 5.2 stable logical effect/idempotency identity                   ✅
                     ├─ 5.3 effect-aware retry rules                                     ✅
                     ├─ 5.4 reconciliation/manual-review outcomes                        ✅
                     └─ 5.5 capability-based permission policy                           ▶ CURRENT"""
          assert plan.count(old_status) == 1
          plan = plan.replace(old_status, new_status)

          old_map = "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | 🚧 In progress — **5.4 current** |"
          new_map = "| **5 — Effects + Permissions + Human interrupts** | effect/idempotency/recovery rules, capability broker, secrets, approvals, structured denials, durable pause/resume | 🚧 In progress — **5.5 current** |"
          assert plan.count(old_map) == 1
          plan = plan.replace(old_map, new_map)

          anchor = "Authorization for key-backed writes is cached per logical op to prevent policy drift between scheduler attempts."
          paragraph = """Authorization for key-backed writes is cached per logical op to prevent policy drift between scheduler attempts.

          Phase 5.4 turns the 4.17 reconciliation/manual holds into explicit, restart-stable recovery outcomes stored as schema-versioned append-only durable events scoped to the exact pre-crash attempt and logical effect ID. Reconciliation can confirm applied (requiring recovered output refs), confirm not applied (yielding explicit `rerun-authorized` authority), or escalate an inconclusive result to manual review. Manual review can confirm applied/not-applied or abandon the recovery to an explicit failure disposition. Outcome commits enter the serialized SQLite write path, verify the still-running durable attempt plus logical-effect identity, validate prior outcome history, and reject skipped reconciliation or changes after a final disposition. 5.4 deliberately records the recovery decision without silently completing/failing the attempt or mutating scheduler frontier state; applying that disposition remains a separate atomic runtime-recovery action. This keeps external-effect observation distinct from committed Harness execution state and prevents uncertain writes from becoming implicit retries."""
          assert plan.count(anchor) == 1
          plan_path.write_text(plan.replace(anchor, paragraph))
          PY

          git rm .github/workflows/harness-5-4-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md
          git commit -m "docs: complete Harness 5.4 recovery outcomes"
          git push
