name: Harness 5.7 Roadmap Handoff

on:
  push:
    branches:
      - zet-harness-v1
    paths:
      - .github/workflows/harness-5-7-roadmap.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zet-harness-v1
      - name: Advance 5.7 to 5.8
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          todo_path = Path('harness/TODO.md')
          todo = todo_path.read_text()
          old_todo = '- [ ] 5.7 Re-check actual capability use at invocation time.'
          new_todo = '- [x] 5.7 Re-check actual capability use at invocation time.'
          if todo.count(old_todo) != 1:
              raise SystemExit(f'TODO 5.7 anchor mismatch: {todo.count(old_todo)}')
          todo_path.write_text(todo.replace(old_todo, new_todo))

          plan_path = Path('harness/PLAN.md')
          plan = plan_path.read_text()
          old_tree = '''           ├─ 5.6 compile-time graph/node capability enforcement                ✅
           └─ 5.7 invocation-time capability re-check                           ▶ CURRENT'''
          new_tree = '''           ├─ 5.6 compile-time graph/node capability enforcement                ✅
           ├─ 5.7 invocation-time capability re-check                           ✅
           └─ 5.8 model/plugin self-grant prevention                            ▶ CURRENT'''
          if plan.count(old_tree) != 1:
              raise SystemExit(f'PLAN tree anchor mismatch: {plan.count(old_tree)}')
          plan = plan.replace(old_tree, new_tree)

          old_phase = '🚧 In progress — **5.7 current**'
          new_phase = '🚧 In progress — **5.8 current**'
          if plan.count(old_phase) != 1:
              raise SystemExit(f'PLAN phase-map anchor mismatch: {plan.count(old_phase)}')
          plan = plan.replace(old_phase, new_phase)

          marker = 'Phase 5.6 reuses the existing 2.13 capability/policy validation stage as the sole compile-time enforcement owner.'
          start = plan.find(marker)
          if start < 0:
              raise SystemExit('PLAN 5.6 paragraph anchor missing')
          end = plan.find('\n\n', start)
          if end < 0:
              raise SystemExit('PLAN 5.6 paragraph terminator missing')
          paragraph = (
              'Phase 5.7 keeps authorization live at the scheduler invocation boundary. Each executor attempt re-evaluates the op’s frozen `requiredCapabilities` against current host authority after concurrency admission but before attempt/retry-budget accounting, effect retry proof, timeout setup, or executor code. Capability-free ops require no authority; required capabilities fail closed when authority is absent; graph `deny` remains a one-way runtime restriction. Duplicate demands are collapsed within one invocation, but host decisions are deliberately not cached between attempts so revocation takes effect before a retry can start. Permission rejection is terminal for that invocation and does not consume another attempt. The scheduler consumes only a narrow structural evaluator compatible with the 5.5 `CapabilityPermissionPolicy`; it does not import Core, expand Graph/schema validation, embed grants in IR, or expose stable machine-readable denial transport, which remains 5.14.'
          )
          if paragraph in plan:
              raise SystemExit('PLAN 5.7 paragraph already present')
          plan = plan[:end + 2] + paragraph + '\n\n' + plan[end + 2:]
          plan_path.write_text(plan)
          PY
      - name: Commit handoff and remove helper
        shell: bash
        run: |
          rm .github/workflows/harness-5-7-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harness/TODO.md harness/PLAN.md .github/workflows/harness-5-7-roadmap.yml
          git commit -m "docs: complete Harness 5.7 invocation capability enforcement"
          git push origin HEAD:zet-harness-v1
