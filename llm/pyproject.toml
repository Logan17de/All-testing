[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-testing-llm"
version = "0.2.0"
description = "Colab-first LLM launchers and local Harness bridges from Logan17de/All-testing"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-dotenv>=1.0",
  "supabase>=2.15",
]

[project.scripts]
qwen-harness-bridge = "qwen_harness_bridge:main"

[tool.setuptools]
py-modules = [
  "qwen3_8_27b_api_colab",
  "qwen3_8_27b_supabase_colab",
  "qwen_supabase_relay",
  "qwen_harness_bridge",
]
