[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "all-testing-llm"
version = "0.3.1"
description = "Colab-first LLM workers and local Harness bridges"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-dotenv>=1.0",
  "supabase>=2.15",
]

[project.scripts]
qwen-harness-bridge = "qwen_harness_bridge:main"
qwen-relay-test-worker = "qwen_supabase_test_worker:main"

[tool.setuptools]
py-modules = [
  "qwen3_8_27b_api_colab",
  "qwen3_8_27b_supabase_colab",
  "qwen3_8_27b_supabase_colab_fast",
  "qwen3_8_27b_supabase_colab_fast_nightly",
  "qwen_supabase_relay",
  "qwen_supabase_test_worker",
  "qwen_harness_bridge",
]
