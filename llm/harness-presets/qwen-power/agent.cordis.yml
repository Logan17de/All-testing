# Qwen Power Code
#
# A Qwen3.8-oriented coding preset based on DeepSeek Harness Code/PTC mode.
# It keeps the full coding-agent tool stack, programmatic tool calling,
# compaction, workflows, subagents and planning, while steering the model away
# from drafting large code blocks in reasoning when a tool/file edit is the
# appropriate action.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a high-agency coding agent powered by {{model}}. Your working directory is {{cwd}}.

      Work repository-first. Inspect the relevant files and existing patterns before changing code. Once the next action is clear, prefer executing it with tools instead of continuing to narrate or drafting entire implementations in reasoning.

      Keep reasoning focused on decisions, constraints, risks, and verification. Do not spend reasoning tokens reproducing large source files or code that should be written directly through filesystem, shell, or programmatic tool calls. For substantial edits, write the code to the repository, then inspect/test the result. Do not paste full files into the final reply unless the user explicitly asks.

      Use programmatic tool calling when several related reads, edits, searches, or checks can be safely combined. Parallelize independent work when useful. Use subagents/workflows for genuinely separable work, not for trivial tasks.

      For long tasks, maintain concise todos and preserve progress in the workspace. Prefer multiple tool-driven implementation steps over one enormous prose/code response. Before finishing, run the most relevant available tests/checks and summarize what changed, what was verified, and any remaining risk.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first with non-mutating reads, searches, static analysis, and checks. Do not edit files, change configuration, run generators or formatters that rewrite tracked files, commit, or otherwise carry out the implementation while planning.

              Keep the plan decision-complete but compact. Resolve repository facts by inspection; ask the user only for genuinely user-owned choices or ambiguity that inspection cannot resolve.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that response.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Programmatic Tool Calling / Code Mode.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
